<script>
// Standalone planning document. All records are synthetic; no API, storage or external requests.
const content=document.getElementById('content');
const bread=document.getElementById('breadcrumb');
let view='overview',step=1,mode='new',fileReady=false,checked=false,completed=false,toastTimer;

function overview(){return header('Spațiul de lucru','Totul într-un singur loc','Urmărește proiectele și vezi unde este nevoie de intervenție.',btn('＋ Adaugă proiect','add','primary'))+
'<div class="scope"><span>◉ Toate proiectele la care ai acces</span><span>·</span><span>Starea curentă · exemple fictive</span></div>'+
'<div class="cards">'+card('Proiecte înrolate','2','1 cu preluarea activă')+card('Job-uri în lucru','3','Se lucrează acum')+card('Necesită intervenție','2','O aprobare și o clarificare','amber')+card('Finalizate săptămâna aceasta','18','Interval demonstrativ')+'</div>'+
'<div class="two"><section class="panel"><div class="panel-title"><h2>Necesită atenție <span class="count">2 job-uri</span></h2>'+pill('Următorul pas este al unui om','amber')+'</div>'+
'<div class="attention"><div class="signal">✓</div><div class="body"><h3>#142 · Adaugă exportul rapoartelor</h3><p>Portal clienți · Rezultatul este verificat și așteaptă aprobarea pe GitHub.</p><p><strong>Cine intervine:</strong> Ana Popescu, verificator desemnat.</p></div>'+btn('Vezi ce trebuie făcut →','job')+'</div>'+
'<div class="attention"><div class="signal">?</div><div class="body"><h3>#87 · Notificări pentru comenzi</h3><p>Serviciu comenzi · Agentul are nevoie să știe cine primește notificările.</p><p><strong>Următorul pas:</strong> răspuns în ticket-ul GitLab.</p></div>'+btn('Vezi clarificarea','clarification')+'</div>'+
'<div class="note neutral">Job-urile care așteaptă răspuns sunt distincte de proiectele cu preluarea de ticket-uri oprită.</div></section>'+
'<section class="panel"><div class="panel-title"><h2>Cum lucrează ADORE?</h2></div><div class="flow-line"><span class="stepnum">1</span><div><strong>Preia un ticket eligibil</strong><p>Din repository-ul conectat, după regulile proiectului.</p></div></div><div class="flow-line"><span class="stepnum">2</span><div><strong>Lucrează și verifică rezultatul</strong><p>Agentul folosește un mediu izolat și limitele stabilite.</p></div></div><div class="flow-line"><span class="stepnum">3</span><div><strong>Pregătește livrarea pentru oameni</strong><p>Cere aprobarea prevăzută și publică un draft MR/PR. Integrarea este o decizie umană.</p></div></div></section></div>'+
'<section class="panel"><div class="panel-title"><h2>Proiectele tale</h2>'+btn('Vezi toate proiectele →','projects','link')+'</div>'+projectsTable()+'</section>'}
function projectsTable(){return '<div class="row-table"><table><thead><tr><th>Proiect / repository</th><th>Preluare ticket-uri</th><th>Mediu de lucru</th><th>Job-uri active</th><th></th></tr></thead><tbody><tr><td class="text-strong">Portal clienți<small>GitHub · echipa/portal-clienti</small></td><td>'+pill('● Activă','green')+'</td><td>'+pill('✓ Verificat','gray')+'</td><td>2 în lucru · 1 așteaptă</td><td>'+btn('Deschide →','config','link')+'</td></tr><tr><td class="text-strong">Serviciu comenzi<small>GitLab · echipa/comenzi</small></td><td>'+pill('Ⅱ Oprită','gray')+'</td><td>'+pill('✓ Verificat','gray')+'</td><td>1 în lucru · 1 așteaptă</td><td>'+btn('Vezi job-urile →','jobs','link')+'</td></tr></tbody></table></div>'}

'<div class="note">Preluarea oprită înseamnă că ADORE nu selectează ticket-uri noi. Job-urile aflate deja în lucru continuă.</div><section class="panel">'+projectsTable()+'</section>'+
'<section class="panel"><h2>Pornește de la o configurație cunoscută</h2><p class="muted">Poți copia regulile unui proiect, apoi alegi repository-ul și mediul nou. Job-urile, istoricul și accesul nu se copiază.</p><div class="actions" style="margin-top:18px">'+btn('Clonează setările Portal clienți','clone')+btn('Vezi ce include un export','export','link')+'</div><p class="footnote">Clonarea și exportul portabil sunt funcționalități propuse, simulate în acest document.</p></section>'}
function jobs(){return header('Job-uri','De la ticket la rezultat','Un job este o încercare ADORE de a rezolva un ticket.',btn('Pornește un ticket','start'))+

if(step===5){title='Verifică înainte de înrolare';desc='Configurația validă și un mediu funcțional sunt verificări diferite.';body='<div class="check"><span class="check-icon">✓</span><div><strong>Structura configurației</strong><p>În exemplu, câmpurile necesare sunt completate. Validarea reală se face pe server.</p></div></div><div class="check"><span class="check-icon '+(checked?'':'pending')+'">'+(checked?'✓':'○')+'</span><div><strong>Repository, runtime și agent</strong><p>'+(checked?'Rezultat demonstrativ: mediul este disponibil. Nicio probă externă nu a fost executată.':'Nu au fost verificate. În aplicație, verificarea poate contacta platforma Git și runtime-ul.')+'</p></div></div><div class="note warning">Verificările mediului se pornesc explicit. Nu lansăm probe externe în timp ce completezi câmpurile.</div>'+btn(checked?'Repetă verificarea demonstrativă':'Simulează verificarea mediului','check','primary');help='<strong>Dacă verificarea nu trece</strong><p>Arătăm ce lipsește, câmpul afectat și cum se poate remedia. Nu continuăm prin ghicirea valorilor.</p><p>Prototipul demonstrează numai traseul pozitiv.</p>'}
if(step===6){title='Ce va crea ADORE?';desc='Verifică alegerile. Crearea și activarea preluării sunt două acțiuni distincte.';body=[['Proiect',escapeHtml(draft.name),imported?3:2],['Repository',mode==='toml'?'Din config.toml · echipa/portal-clienti':escapeHtml(draft.repo),imported?3:2],['Mediu','Codex · Docker · exemplu de reconfirmat',imported?4:3],['Setări',mode==='toml'?'Fișierul TOML se copiază neschimbat':mode==='portable'?'Reguli portabile + locații proprii':mode==='clone'?'Reguli copiate; datele proiectului sunt proprii':'Reguli alese pentru proiectul nou',imported?4:4]].map(x=>'<div class="review-row"><div><strong>'+x[0]+'</strong><small>'+x[1]+'</small></div><button class="link" data-step="'+x[2]+'">Modifică</button></div>').join('')+'<div class="note"><strong>Preluarea de ticket-uri începe oprită.</strong><br>Poți activa separat după înrolare. Niciun ticket nu este pornit de acest prototip.</div>';help='<strong>Ultima verificare</strong><p>Poți reveni la orice secțiune. Modificarea sursei poate necesita repetarea verificărilor.</p><p>În backend, confirmarea trebuie să se refere la exact candidatul revizuit.</p>'}
return header('Înrolare ghidată','Adaugă un proiect','Pasul '+step+' din 6 · '+(mode==='toml'?'configurație existentă':mode==='portable'?'import portabil propus':mode==='clone'?'copiere de reguli propusă':'configurare nouă'),btn('Ieși din simulare','projects'))+
'<div class="wizard-grid"><nav class="wizard-steps" aria-label="Pașii înrolării">'+names.map((name,i)=>'<div class="wizard-step '+(i+1===step?'active':i+1<step?'complete':'')+'"><span class="stepnum">'+(i+1<step?'✓':i+1)+'</span><span class="step-text">'+name+'</span></div>').join('')+'</nav><section class="panel wizard-body"><h2>'+title+'</h2><p>'+desc+'</p>'+body+'<p id="wizard-error" class="error" style="color:#a43c40" role="alert"></p><div class="wizard-footer">'+(step>1?btn('← Înapoi','back'):btn('Anulează','projects'))+btn(step===6?'Simulează crearea cu preluarea oprită':step===5?'Revizuiește alegerile →':'Continuă →',step===6?'finish':'next','primary')+'</div></section><aside class="context-help">'+help+'</aside></div>'}
function escapeHtml(text){return String(text).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function saveDraft(){content.querySelectorAll('[data-draft]').forEach(el=>draft[el.dataset.draft]=el.value)}
function render(){document.querySelectorAll('.nav-button').forEach(x=>x.classList.toggle('active',x.dataset.view===view||(view==='job'&&x.dataset.view==='jobs')||(['wizard','config'].includes(view)&&x.dataset.view==='projects')));bread.textContent='Spațiul de lucru / '+labels[view];const pages={overview,projects,jobs,job,stats,config,users,audit,wizard};content.innerHTML=pages[view]();if(view==='stats')statsData()}
document.addEventListener('click',event=>{const nav=event.target.closest('[data-view]');if(nav){go(nav.dataset.view);return}const method=event.target.closest('[data-mode]');if(method){mode=method.dataset.mode;fileReady=false;checked=false;render();return}const jump=event.target.closest('[data-step]');if(jump){saveDraft();step=Number(jump.dataset.step);checked=false;render();return}const action=event.target.closest('[data-action]');if(!action)return;const a=action.dataset.action;
if(['overview','projects','jobs','stats','config','users','audit','job'].includes(a)){go(a);return}
if(['add','import','clone'].includes(a)){step=1;mode=a==='import'?'portable':a==='clone'?'clone':'new';fileReady=false;checked=false;completed=false;go('wizard');return}
if(a==='next'){saveDraft();let issue='';const imported=mode==='portable'||mode==='toml';if(step===2&&imported&&!fileReady)issue='Selectează exemplul demonstrativ pentru a continua. Fișierul real nu este procesat.';if(((step===2&&!imported)||(step===3&&imported))&&!draft.name.trim())issue='Completează numele proiectului.';if(step===2&&!imported&&(!draft.repo.trim()||!draft.folder.trim()||!draft.branch.trim()))issue='Completează repository-ul, folderul de pe server și branch-ul țintă.';if(step===5&&!checked)issue='Simulează verificarea mediului înainte de recapitulare.';if(issue){document.getElementById('wizard-error').textContent=issue;return}step++;render();window.scrollTo(0,0);return}
if(a==='back'){saveDraft();step--;render();return}if(a==='example-file'){fileReady=true;render();return}if(a==='check'){checked=true;render();return}if(a==='finish'){completed=true;render();return}
if(a==='stage'){const value=document.getElementById('retry').value;if(!value||Number(value)<1||Number(value)>10){toast('În exemplu, alege o valoare între 1 și 10.');return}document.getElementById('new-limit').textContent=value;document.getElementById('config-review').hidden=false;toast('Candidat demonstrativ pregătit. Revizuiește diferența înainte de aplicare.');return}
if(a==='discard'){document.getElementById('config-review').hidden=true;toast('Candidatul demonstrativ a fost închis.');return}if(a==='apply'){toast('Simulare: modificarea ar fi aplicată după verificarea reviziilor și a condițiilor pe server.');return}
if(a==='new-user'){document.getElementById('userform').hidden=false;document.getElementById('username').focus();return}
if(a.startsWith('jobs-')){const category=a.slice(5);content.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===action));content.querySelectorAll('#jobtable tbody tr').forEach(x=>x.hidden=category!=='all'&&x.dataset.category!==category);return}
const messages={clarification:'Exemplu: cine trebuie să primească notificarea? În aplicație, răspunzi în ticket-ul GitLab; prototipul nu trimite comentarii.',forge:'Aici se deschide ticket-ul de pe forge pentru aprobarea candidatului curent. În acest document nu există un ticket real.',start:'Pornirea manuală va cere proiectul și ticket-ul, apoi va arăta efectul și condițiile. Niciun job nu este pornit aici.',unreported:'Nu există date de consum raportate pentru acest exemplu. Nu îl numărăm drept zero măsurat.',result:'Exemplu de rezultat: draft PR publicat. Nu este dovadă de merge.',export:'Export portabil propus: reguli și preferințe. Exclude secretele, directoarele, job-urile, utilizatorii și istoricul. Nu este generat niciun fișier real aici.','metrics-export':'Exportul real trebuie să folosească exact proiectele și perioada din pagină. Această acțiune este demonstrativă.','config-category':'Prototipul detaliază categoria „Limite și recuperare”. Celelalte categorii sunt descrise în propunerea UX.',limits:'Categoria curentă este „Limite și recuperare”.','review-user':'Simulare: revizuiește rolul și proiectele înainte de creare. Niciun cont real nu a fost creat.',retention:'Politica de retenție este mutată în administrare; istoricul rămâne conținutul principal.'};toast(messages[a]||'Acțiune demonstrativă. Nicio modificare reală.');});
document.addEventListener('change',event=>{if(event.target.id==='statproject'||event.target.id==='statperiod')statsData();if(event.target.id==='role')document.getElementById('project-grants').hidden=event.target.value==='admin';if(event.target.id==='import-file'){toast('Fișierul nu este citit de prototip. Folosește exemplul demonstrativ pentru a parcurge fluxul.');}});
document.addEventListener('input',event=>{if(event.target.id==='jobsearch'){const query=event.target.value.toLocaleLowerCase('ro');let visible=0;content.querySelectorAll('#jobtable tbody tr').forEach(x=>{x.hidden=!x.textContent.toLocaleLowerCase('ro').includes(query);if(!x.hidden)visible++});document.getElementById('jobempty').hidden=visible>0;}});
render();
</script>
</body>
</html>
