[project]
name = "adore"
version = "0.13.0"
description = "Agentic Delivery Orchestrator & Runtime Engine - ticket-to-draft-MR orchestration over an agentic workflow."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eng. Dan Dumitru Pasare" }]
# Runtime is standard-library only by design. Keep this empty.
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "argon2-cffi>=25.1,<26",
    "tzdata>=2026.4",
]

[project.scripts]
adore = "adore.cli:main"
adore-web = "adore.web.server:main"
adore-web-worker = "adore.web.commands:main"

# Dev-time tooling only (not required to run ADORE).
[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=8",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adore"]

[tool.hatch.build.targets.wheel.force-include]
"docker/Dockerfile.executor-base" = "adore/_executor_recipe/Dockerfile"
"docker/pi/adore-guard.ts" = "adore/_executor_recipe/pi/adore-guard.ts"
"docker/pi/adore-chatgpt.mjs" = "adore/_executor_recipe/pi/adore-chatgpt.mjs"
"../LICENSE.txt" = "adore/_executor_recipe/LICENSE.txt"

# ADORE's own tests only: worktrees/ holds live run checkouts of the TARGET
# repository, whose test suites are not ours to collect.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["worktrees", ".adore", ".venv"]
