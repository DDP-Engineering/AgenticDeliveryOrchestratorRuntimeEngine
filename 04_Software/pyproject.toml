[project]
name = "ador"
version = "0.6.0"
description = "Agentic Delivery Orchestrator - ticket-to-draft-MR orchestration over an agentic workflow."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eng. Dan Dumitru Pasare" }]
# Runtime is standard-library only by design. Keep this empty.
dependencies = []

[project.scripts]
ador = "ador.cli:main"

# Dev-time tooling only (not required to run ADOR).
[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ador"]

# ADOR's own tests only: worktrees/ holds live run checkouts of the TARGET
# repository, whose test suites are not ours to collect.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["worktrees", ".ador", ".venv"]
