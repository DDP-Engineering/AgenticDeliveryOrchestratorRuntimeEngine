# =============================================================================
# ADORE example configuration.
#
# Copy this file to `config.toml` next to where you run `adore`, adjust the
# values, then check it with:  adore config validate
#
# Rules:
#   - Secrets (tokens, API keys) do NOT belong here; they live in the
#     environment or a gitignored `.env` (template: `.env.example`).
#   - Every key shown here has a sensible default; you can delete any line or
#     whole section you do not want to override. The only values you MUST set
#     are [platform] repo and [executor.<name>] command/model.
#   - Full reference with all defaults and rationale:
#     ../01_Documentation/Configuration_Reference.md
# =============================================================================

# ----- Bot identity ----------------------------------------------------------
# Renaming the bot is a single change here: every derived identifier follows.
[agent]
# Display/brand string: visible comment tag ("[ADORE]"), MR/PR titles, and the
# git commit author name.
name = "ADORE"
# Lowercase token deriving all local names: state dir (".adore/"), branch
# prefix ("adore/<run-id>"), container name ("adore-run-<run-id>"), questions
# file ("ADORE_QUESTIONS.md"), and the hidden comment marker ("<!-- adore:... -->").
# Leave out (or empty) to derive it from `name`.
slug = "adore"
# Git commit author email used inside the executor container (with `name` as
# the author name). Leave out to derive "<slug>-bot@local"; use a recognizable
# address in production, e.g. "adore-bot@example.com".
email = "adore-bot@example.com"

# ----- Git platform ----------------------------------------------------------
[platform]
# Which adapter to use: "gitlab" (glab CLI), "github" (gh CLI) or "gitea"
# (tea CLI >= 0.15). The matching CLI must be installed and authenticated on
# the host.
kind = "gitlab"
# Project path (GitLab: GROUP/.../PROJECT), repository (GitHub: OWNER/REPO),
# or repository (Gitea: exactly "owner/repo" - no subgroups).
# REQUIRED - there is no default.
repo = "group/subgroup/project"
# login = "home"  # gitea only: tea login name (tea logins list)

# ----- State signaling -------------------------------------------------------
# How run state is reflected ON THE TICKET for humans. The authoritative state
# always lives locally under the store_root; the ticket only mirrors it.
[state]
# Accepted values: "comments" | "labels" | "both". Validated for compatibility;
# the runtime mirrors every state change with ONE status comment, edited in
# place, and the lifecycle labels regardless of this value. Clarification and
# delivery notices are separate comments.
channel = "comments"
# Local authoritative state directory (runs, lock, pause flag, metrics).
# Leave out to derive ".<slug>".
store_root = ".adore"

# ----- Polling ---------------------------------------------------------------
# v1 trigger is polling; no webhook or inbound service.
[polling]
# "loop" = long-running process sleeping between passes (service mode);
# "once" = a single pass per invocation, scheduled externally by cron (Linux)
#          or Task Scheduler (Windows).
mode = "loop"
# Base wait after completed passes in CLI loop and the web worker, in seconds.
poll_interval_seconds = 60
# Random 0..maximum seconds added after backoff, to avoid synchronized checks.
poll_jitter_seconds = 5
# Double waits after failed checks (up to 8x); reset after success. Web includes nonzero/uncertain CLI outcomes.
poll_backoff = true
# How many tickets may be in flight at once (worktree + container each).
max_concurrent_runs = 1
# Windows where polling pauses entirely, e.g. ["22:00-06:00"]. Empty = never.
quiet_hours = []

# ----- Readiness filter (selection) --------------------------------------------
# Applied AFTER the eligibility label: a ticket that is `agent-ready` but fails
# these checks is left for a human instead of being picked.
[readiness]
# Optional: require "acceptance criteria" text or an unchecked - [ ] item.
require_acceptance_criteria = false
# Require one of the priority labels (see [labels.selection]).
require_priority_label = true
# Skip tickets estimated larger than this scope hint.
# NOT YET ENFORCED: accepted and validated, but large tickets are NOT skipped
# (review finding ADORE-ARCH-006).
max_scope_hint = "small"

# ----- Labels ------------------------------------------------------------------
# All label STRINGS are configurable; the orchestrator refers to labels only by
# their role, so a team can rename any label without code changes.

# Lifecycle labels - managed by the orchestrator (only applied when
# state.channel includes "labels"). `ready` and `answered` are the two a HUMAN
# applies to move a ticket into / back into the flow.
[labels.lifecycle]
ready    = "agent-ready"      # eligible, not yet picked (human opt-in)
working  = "agent-working"    # claimed - the lock against double pickup
clarify  = "agent-clarify"    # parked, waiting on a human clarification answer
answered = "agent-answered"   # human override: force-resume a parked run
review   = "agent-mr"         # draft MR/PR opened, awaiting human review
failed   = "agent-failed"     # gave up after retries/budgets, needs a human
done     = "agent-done"       # optional: set after the human merges

# Selection labels - human-managed, read at pickup for ordering and typing.
# Priority: high wins; teams can add tiers (e.g. P0) by renaming here.
[labels.selection]
priority_high   = "P1"
priority_medium = "P2"
priority_low    = "P3"
type_feature    = "feature"
type_bug        = "bug"

# Control labels - human overrides, checked BEFORE eligibility (they always win).
[labels.control]
hold    = "agent-hold"        # never pick while present, even if agent-ready
exclude = "no-agent"          # permanently human-only, ignore always

# Executor pin - optional per-ticket executor override, e.g. a ticket labelled
# "agent-exec:opencode" forces that executor for its run.
[labels.executor]
prefix = "agent-exec:"

# ----- Executor ----------------------------------------------------------------
[executor]
# Which executor to launch: "opencode" | "pi" | "codex".
# Must have a matching [executor.<name>] table below.
default = "opencode"
# "thick"    = the orchestrator drives gate-by-gate and verifies in between
#              (recommended; matches the workflow's stop-after-each-gate design).
# "headless" = single-shot: launch once and read the final result only.
# RESERVED; NOT YET CONSULTED BY THE RUNTIME: the conductor is unconditionally
# thick regardless of this value (review finding ADORE-ARCH-007).
mode = "thick"
# File the executor writes blocking questions to before stopping; its presence
# after a gate is the deterministic "needs clarification" signal.
# Leave out to derive "<SLUG>_QUESTIONS.md".
questions_file = "ADORE_QUESTIONS.md"
# The ONLY environment variables passed into the executor container (values
# come from the host environment or .env; design: scope secrets minimally).
env_keys = ["OPENAI_API_KEY", "ANTHROPIC_API_KEY"]
# PILOT-ONLY: copy the selected OpenCode or Codex host OAuth auth.json
# into the run container at provision. Pi and Qwen are not supported. Use when no provider API key
# exists yet (01_Documentation/Security_And_Credentials.md). Fragile for
# long-running use
# (refresh tokens rotate); production needs a real key in .env instead.
stage_host_auth = false

# One table per executor. `command` is a template; ADORE substitutes {prompt},
# {model}, and {worktree}. SAFETY: never add --auto (it would auto-approve the
# push/merge permissions that must stay blocked; the executor never touches
# the remote - the orchestrator owns push and MR creation).
[executor.opencode]
command = "opencode run --dir {worktree} -m {model} --format json {prompt}"
# Model in provider/model form; the provider API key comes from .env.
model = "openai/gpt-5.4-fast"

# Alternative executor: Pi (@earendil-works/pi-coding-agent). To use it, set
# `default = "pi"` above and uncomment this table. Pi reads AGENTS.md natively
# and gets its push/merge guardrails from the repo's `.pi` agentic-guard
# extension (enforced in headless/json mode). It must be installed in the
# executor image, and the project must be trusted for headless runs.
# [executor.pi]
# command = "pi -p --mode json --model {model} {prompt}"
# model = "openai/gpt-5.5"

# Alternative executor: OpenAI Codex (@openai/codex). To use it, set
# `default = "codex"` above and uncomment this table. Codex reads AGENTS.md
# natively. {resume} becomes `resume --last ` on continuation (Codex resumes
# a prior session only outside ADORE; each ADORE gate is fresh). SAFETY: full-auto Codex mode is
# acceptable only because ADORE runs executors inside an external container/
# worktree sandbox and keeps push/MR ownership outside the executor.
# `--ignore-user-config` plus `--disable plugins` prevents workstation-local
# and bundled Codex plugin/marketplace state from bleeding into the container;
# ADORE stages only auth.json into an isolated CODEX_HOME when
# `stage_host_auth = true`.
# [executor.codex]
# command = "codex exec {resume}--json --model {model} --ignore-user-config --disable plugins --dangerously-bypass-approvals-and-sandbox {prompt}"
# model = "gpt-5.5"

# Alternative executor: Qwen Code (@qwen-code/qwen-code, a Gemini-CLI fork). To
# use it, set `default = "qwen"` above and uncomment this table. Qwen reads
# AGENTS.md natively and is guarded by the repo's `.qwen` hooks + deny list.
# It runs STATELESS per gate (no session continuation). SAFETY: the command
# must not use --yolo / --approval-mode yolo (validation enforces this). Auth is
# OpenAI-compatible: OPENAI_API_KEY (+ OPENAI_BASE_URL for the Qwen/Dashscope
# endpoint) in .env, or the Qwen OAuth free tier.
# [executor.qwen]
# command = "qwen -p --model {model} --output-format json {prompt}"
# model = "qwen3-coder-plus"

# ----- Clarification -----------------------------------------------------------
# Bounds for parked runs (executor asked a question, waiting on a human).
[clarification]
# Ask/answer cycles allowed before the run escalates to `failed`.
max_rounds = 3
# Optional single nudge comment (@-mentions assignee) this long after parking.
# Durations accept s/m/h/d suffixes, e.g. "90m", "24h", "3d".
reminder_after = "24h"
# Hard timeout: with no human reply for this long, post a closing comment,
# release the ticket back to humans, and end the run.
answer_timeout = "72h"
# Terminal state applied on that timeout: "failed" or "stale".
timeout_state = "failed"

# ----- Container / isolation ---------------------------------------------------
# Execution isolation: the executor always runs inside a container; the git
# worktree is mounted in. Both exist once per run-id.
# Optional reviewed project preparation; see Container_Preparation.md.
# Selection is a tracked path#job@full-reviewed-target-commit, never a branch name.
[execution]
backend = "container"
preparation = ""
preparation_step_timeout_seconds = 300
preparation_total_timeout_seconds = 900
preparation_max_attempts = 2

[container]
# "docker" | "podman", optionally wrapped when the daemon lives elsewhere -
# e.g. Docker Engine inside WSL2 (no Docker Desktop):
#   runtime = "wsl -d Ubuntu-24.04 -- docker"
# In WSL mode ADORE translates mount paths (D:\x -> /mnt/d/x) and propagates
# container env values across the WSL boundary via WSLENV automatically.
runtime = "docker"
# Executor image selected by this runtime-project profile. ADORE's generic
# default is `adore-executor-base:1.0.0` (executor tooling only). Runtime
# projects should derive their own image from that base and add project
# dependencies.
image = "adore-executor-project:latest"
# Keep the container (stopped) when a run parks, so resume is a fast start.
keep_parked = true
# How the parked-container grace period is measured: "polls" | "seconds".
parked_ttl_mode = "polls"
# Reap (stop+remove) a parked container after this many seconds (mode=seconds)...
parked_ttl_seconds = 7200
# ...or after this many poll cycles without an answer (mode=polls).
# Reaping the container never ends the run; worktree and state persist.
parked_ttl_polls = 30
# Persistent cache volumes so per-run `uv sync` / `npm ci` stay fast.
uv_cache_volume  = "adore-uv-cache"
npm_cache_volume = "adore-npm-cache"
# Non-secret runtime environment injected at container creation and every
# `exec`. ADORE reserves HOME/GIT_*/CODEX_HOME for isolation; use this for
# portable tool behavior. Default keeps uv package links copy-based, which is
# safer on Windows/WSL bind mounts.
runtime_env = { UV_LINK_MODE = "copy" }
# Extra option tokens for `<runtime> run` - one option per entry, no spaces.
# DOCKER: the executor base image must be built with --build-arg USER_UID=$(id -u)
# so the container user matches the host user. No run_args needed for UID mapping.
# ROOTLESS PODMAN: requires ["--userns=keep-id"] instead (verified live 2026-07-04:
# without it, container uid 1000 maps to a subuid that cannot write the
# bind-mounted worktree). Podman maps the container UID to the host UID at
# runtime; no image rebuild needed.
# Also the place for future resource limits, e.g. "--memory=2g", "--cpus=2".
run_args = []
# SELinux relabeling for ADORE's host bind mounts: "off" | "shared".
# Leave "off" on Windows/WSL and Ubuntu hosts, which do not enforce SELinux.
# Set "shared" on Fedora/RHEL/CentOS Stream/Rocky/Alma, where SELinux is
# enforcing by default: without it the mounted clone, worktree and io dir keep
# their host file label, `container_t` cannot read them, and every stage fails
# on permission denied. "shared" appends `z` to those three bind mounts and to
# the generated egress-proxy config; the named cache volumes need nothing,
# because the runtime already labels them.
# The private `Z` label is deliberately not offered: it labels content per
# container, and the repository clone is shared by every run and by host git,
# so `Z` would lock the clone to one container and break the next run.
selinux_relabel = "off"
# Project-image fail-fast checks. Keep empty for executor-base-only validation;
# add the tools your runtime project needs before any executor gate can run.
required_tool_checks = [
  "make --version",
  "shellcheck --version",
  "terraform --version",
  "tflint --version",
]

[container.egress]
# "open" = unrestricted egress, intended for supervised operation.
# "none" = start executor containers with --network none for fully offline,
#          pre-provisioned runs.
# "allowlist-proxy" = executor has no direct internet; HTTP/HTTPS egress goes
#                     through an ADORE-managed per-run proxy container.
mode = "open"
# Exact or wildcard hostnames only. Runtime projects fill this with the
# minimum hosts their executor and package manager require, e.g.
# ["gitlab.example.com", "api.openai.com", "*.pythonhosted.org"].
allowlist = []
# Bypassed by proxy-aware tools. Keep loopback defaults unless your executor
# also needs an internal hostname.
no_proxy = ["localhost", "127.0.0.1", "::1"]
# Build from docker/Dockerfile.egress-proxy.
proxy_image = "adore-egress-proxy:1.0.0"
proxy_port = 3128
network_prefix = "adore-egress"

# ----- Worktree ------------------------------------------------------------------
[worktree]
# Local clone of the target repository that per-run worktrees are created
# from. REQUIRED for isolation: it is mounted (with the worktree) into the
# executor container, so runs share its object store.
repo_path = "../project"
# Host directory holding the per-run git worktrees (<root>/<run-id>).
root = "worktrees"
# Run branch name; placeholders: {slug}, {run_id}, {iid}. Must contain
# {run_id} or {iid} (uniqueness). Adjust to the repo's naming convention,
# e.g. a mandatory feature/ prefix:  "feature/{slug}-{iid}"
branch_template = "{slug}/{run_id}"
# Optional: the repo's branch-name push rule (regex). When set,
# `adore config validate` verifies the rendered template would be ACCEPTED
# by the rule, so a push-rule rejection can never surprise a run.
# Example (GitLab):  branch_rule = '^(feature|bugfix|release|hotfix)\/.*$'
branch_rule = ""

# ----- AEGIS workflow ------------------------------------------------------------
# How a ticket becomes an AEGIS task journal (AEGIS 0.5+, schema 1). ADORE creates the task after
# creating the task branch; the frame executor chooses and justifies its path.
# All of them are optional - the defaults below are what ADORE uses when the
# section is absent.
[workflow]
# Run kind for a ticket that carries none of the labels below.
# One of: feature, fix, change. ("adoption" runs are interactive and are not
# conducted by ADORE, so they are rejected here.)
default_kind = "feature"
# Ticket label -> AEGIS task type. Bug/fix wins over change, then feature.
kind_labels = { bug = "fix", fix = "fix", change = "change" }
# Framing hint only. The executor remains responsible for selecting and
# justifying full or quick in the task journal.
quick_label = "agent-quick"
# Python executable used for `python .agentic/aegis.py ...`.
aegis_python = "python"
# Optional per-stage override of [budgets] per_gate_timeout_seconds, for the
# stages that legitimately need more room than intake does. Keys must be AEGIS
# stage names; values are whole seconds.
# stage_timeout_overrides = { build = 5400, validate = 3600 }
stage_timeout_overrides = {}

# ----- Failure recovery ----------------------------------------------------------
# Failed stage ATTEMPTS are distinct from individual AEGIS findings. The third
# failed attempt stops; transient container/git/forge transport retries use a
# separate counter and never consume this stage budget.
[recovery]
max_stage_failures = 3
max_transient_retries = 3
retry_backoff_seconds = [5, 30, 120]

# ----- Run budgets ---------------------------------------------------------------
# Hard bounds per run; exceeding any of them escalates to `failed` instead of
# thrashing forever. Tripping a budget never loses work: `adore retry` re-arms
# the counters and continues from where AEGIS says the run stands (it never
# redoes closed stages).
[budgets]
# Executor LAUNCHES per run: six working stages for a full path, four for quick,
# plus remediation, delivery bookkeeping and close-out launches. The default
# provides bounded unattended headroom.
max_iterations           = 20
max_wall_clock_seconds   = 3600   # total wall-clock per run (whole-run ceiling)
per_gate_timeout_seconds = 1800   # default wall-clock bound on ONE executor launch
max_cost_usd             = 5.0    # reported cost cap; 0 disables this cap
max_files_touched        = 120    # includes AEGIS forms/evidence + product files

# ----- Delivery ------------------------------------------------------------------
# ADORE opens the configured review state after human approval. It never merges.
# true creates a draft; false creates a review-ready PR/MR. Both require human approval.
[delivery]
# Branch the MR/PR targets.
target_branch = "develop"
# Default true: create a draft. Set false to create a PR/MR ready for review.
draft = true
# Human reviewer(s) assigned to the MR/PR. Optional - [] requests no review.
reviewers = ["reviewer.one"]
# Delete the run branch when the human merges (GitLab option).
remove_source_branch = true
# ADORE removes this label before presentation and accepts only a fresh re-add.
approval_label = "agent-approved"
# Publish remote WIP checkpoints by default; delivery needs fresh human approval.
# Set false to keep intermediate checkpoints local.
publish_checkpoints = true

# ----- Post-MR review loop ----------------------------------------------------
# How ADORE reacts to review feedback on its draft MR. It never auto-reacts to
# every comment: by default a reviewer explicitly requests a revision.
[review]
# ADORE accepts the explicit label trigger only.
trigger = "label"
# The label a reviewer applies to request an agent revision.
revise_label = "agent-revise"
# Revise cycles before the run escalates to `failed`. Bounds human-requested
# revisions and automatic pipeline repairs together, so a permanently red
# pipeline cannot loop.
max_review_rounds = 5
# What a NEW `failed` forge pipeline verdict on the published draft does:
#   "revise" - start a governed repair round automatically (default). Same
#              bounded path as the revise label: a new AEGIS task on the same
#              branch, ending at strict validation and a FRESH human approval
#              before anything is pushed. ADORE still never merges.
#   "notify" - post one comment on the draft and wait for a human.
#   "ignore" - skip the pipeline read entirely (no CI in this repository).
# Only a CHANGED verdict is a signal, so a run waiting days is neither nagged
# nor repaired twice for one failure. An unreadable verdict is silent.
on_pipeline_failure = "revise"
# Optional nudge if the MR sits undecided this long.
# RESERVED; NOT YET CONSULTED BY THE RUNTIME: no MR-reminder nudge is
# implemented (review finding ADORE-ARCH-007).
review_reminder_after = "48h"

# ----- Reconciliation ------------------------------------------------------------
# Reactions when the outside world changes under a waiting run, so a deleted
# or closed ticket never leaves a zombie run or orphaned container.
#
# STATUS (review finding ADORE-ARCH-005): on_ticket_deleted / on_ticket_closed
# are validated but their configured VALUES are not consulted - reconciliation
# applies the fixed behavior described below, and only to runs waiting for
# approval, a clarification answer or review. A run in review checks its MR/PR
# first: a merged MR/PR completes it, a closed one fails it (MR_CLOSED) and one
# that stays missing fails it (MR_DELETED), whatever the ticket's state.
# on_trigger_removed is NOT IMPLEMENTED AT ALL: adding the hold label mid-run
# does NOT stop an active `working` run. Use `adore cancel <run-id>`.
[reconcile]
# Ticket deleted: "abort-cleanup" (stop + remove container/worktree) | "ignore".
# NOT ENFORCED - whatever this value, a waiting run whose ticket is deleted
# fails visibly (TICKET_DELETED): its container stops and its worktree and
# evidence stay.
on_ticket_deleted = "abort-cleanup"
# Ticket closed by a human mid-run: "cancel" (graceful stop + comment) | "ignore".
# NOT ENFORCED - whatever this value, a waiting run whose ticket is closed is
# cancelled: its container, worktree and local branch are removed and its
# state history stays.
on_ticket_closed = "cancel"
# Trigger label removed / hold added mid-run: "pause" | "abort" | "ignore".
# NOT IMPLEMENTED - this key has no effect; use `adore cancel <run-id>`.
on_trigger_removed = "pause"

# ----- Metrics / statistics ------------------------------------------------------
# Standard-library-only statistics (sqlite3 + json). Access is CLI-first
# (`adore stats`, `adore report`, `adore export`) plus an optional static HTML
# file; there is no Prometheus endpoint or hosted service.
[metrics]
enabled = true
# SQLite database of run summaries. Leave out to derive "<store_root>/metrics.db".
db_path = ".adore/metrics.db"
# Mirrored append-only JSONL export of the same summaries.
export_jsonl = ".adore/metrics/runs.jsonl"
# Record executor token usage per run/gate (from the executor CLI stats).
capture_tokens = true
# Probe container/disk resource stats (docker stats / disk usage).
# RESERVED; NOT YET CONSULTED BY THE RUNTIME: no resource probing is
# implemented (review finding ADORE-ARCH-007).
capture_resource = true
# Output path for the self-contained `adore stats --html` dashboard.
html_out = ".adore/metrics/stats.html"

# Native local alternative: switch the existing [execution] backend to "local".
# Keep preparation empty; remove container required_tool_checks/run_args/custom
# runtime_env, set egress open and stage_host_auth=false. No tools are installed.
# Select installed native argv; Windows npm shims need explicit node.exe + installed JS.
# Each gate starts fresh; {resume} is empty, including Codex.
# [local]
# account = "current"  # Actual ADORE account; named value asserts it.
# home = ""           # Already prepared home; blank uses the account default.
# path = ""           # Already prepared PATH; blank uses native PATH.
# environment = {}    # Non-secret only; approved keys belong in protected .env.
# cgroup_root = ""    # Linux: delegated absolute cgroup-v2 root with cgroup.kill.
# See ../01_Documentation/Local_Execution.md; worktrees are not host sandboxes.
