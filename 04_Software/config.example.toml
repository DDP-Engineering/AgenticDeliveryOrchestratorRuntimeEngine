#
# ADORE source-checkout example. Copy to config.toml and adjust it locally.
# Validate with: adore -c config.toml config validate
# Set the forge/repository, worktree.repo_path, provider/model and execution
# environment for your host. config.toml and .env are ignored by Git.
# Secrets belong in the environment or .env, never in this file.
# This example shows operational settings; omitted settings use their defaults.
# Full reference: ../01_Documentation/Configuration_Reference.md

[agent]
name = "ADORE"
slug = "adore"
email = "adore-bot@example.com"

# The matching gh/glab/tea CLI, or az with its official azure-devops extension,
# must be authenticated on the host. Azure DevOps Services (cloud) only:
# use config.azure-devops.example.toml for its mandatory explicit scope.
# Git clone/push authentication is separate from forge CLI authentication.
[platform]
kind = "gitlab"                      # gitlab | github | gitea | azure_devops
repo = "group/subgroup/project"      # Gitea/GitHub: owner/repo
# login = "home"                     # Gitea only

[state]
store_root = ".adore"

# The web worker manages enrolled projects. Do not run another CLI loop over
# those profiles. A standalone CLI profile can use loop or once.
[polling]
mode = "loop"
poll_interval_seconds = 60
poll_jitter_seconds = 5
poll_backoff = true
max_concurrent_runs = 1
quiet_hours = []

[readiness]
require_acceptance_criteria = false
require_priority_label = true

# ADORE manages lifecycle labels. A new reply plus the answered label resumes
# clarification. Editing a lifecycle label does not transition stored job state.
[labels.lifecycle]
ready = "agent-ready"
working = "agent-working"
clarify = "agent-clarify"
answered = "agent-answered"
review = "agent-mr"
failed = "agent-failed"
done = "agent-done"

[labels.selection]
priority_high = "P1"
priority_medium = "P2"
priority_low = "P3"
type_feature = "feature"
type_bug = "bug"
type_epic = "epic"

# These labels prevent new pickup. Use confirmed Cancel to stop active work.
[labels.control]
hold = "agent-hold"
exclude = "no-agent"

# Pi is the only executor. Containers use their image's pinned Pi; local runs
# use ADORE-managed Pi. Provider keys are included automatically. env_keys is
# only for additional permitted secrets; forge tokens are never allowed there.
[executor]
provider = "openai"
model = "gpt-6.1-terra"
internet = false                     # Controls container egress, not local networking
questions_file = "ADORE_QUESTIONS.md"
env_keys = []
# Both backends use fixed Pi RPC; there is no command template to configure.
# ChatGPT subscriptions use server sign-in; set provider = "chatgpt" and its model.
# ChatGPT attempt timeouts, including stage overrides, must be at most 3000 seconds.
# For a custom endpoint, set provider = "custom" and configure its current API:
# [executor.endpoint]
# base_url = "http://model-server:1234/v1"
# api = "openai-completions"
# Internet-on container web search: exa (default), brave, tavily or none.
# Brave/Tavily require their search key in Settings or .env.
# [executor.web]
# search = "exa"

[clarification]
max_rounds = 3
answer_timeout = "72h"
timeout_state = "failed"

# One pinned execution environment per job. A changed image, backend or resource
# identity requires a fresh job. Preparation is an optional reviewed selection;
# see Container_Preparation.md. It is container-only.
[execution]
backend = "container"               # container | local
preparation = ""
preparation_step_timeout_seconds = 300
preparation_total_timeout_seconds = 900
preparation_max_attempts = 2

# Container-only settings. Build and select a project image with its tools.
# system_packages grants package-manager sudo; networking is configured separately.
[container]
runtime = "docker"                  # docker | podman | WSL-wrapped command
# Example name. Use the image you built for this project, or remove the line to
# use the standard image adore-executor-base:1.0.0.
image = "adore-executor-project:latest"
system_packages = false
keep_parked = true
parked_ttl_mode = "polls"
parked_ttl_seconds = 7200
parked_ttl_polls = 30
uv_cache_volume = "adore-uv-cache"
npm_cache_volume = "adore-npm-cache"
runtime_env = { UV_LINK_MODE = "copy" }
run_args = []                       # Rootless Podman: ["--userns=keep-id"]
selinux_relabel = "off"             # SELinux hosts can require "shared"
# Example checks. Each command must succeed in the image above: a job stops
# before its first stage when one fails. Remove the line when your image has
# no such tools.
required_tool_checks = ["make --version", "shellcheck --version", "terraform --version", "tflint --version"]
# build_definition = "path/to/build.json@FULL_COMMIT"

# With internet = false, ADORE permits the provider hosts automatically.
# Add only the additional package/service hosts this container project needs.
[container.egress]
allowlist = []
no_proxy = ["localhost", "127.0.0.1", "::1"]
proxy_image = "adore-egress-proxy:1.0.0"
proxy_port = 3128
network_prefix = "adore-egress"

# The local clone path is required. Adjust it before starting.
[worktree]
repo_path = "../project"
root = "worktrees"
branch_template = "{slug}/{run_id}"
branch_rule = ""

# Installed AEGIS uses its journal; without AEGIS, Direct runs build/validate/done.
# An invalid installed AEGIS is refused. The agent chooses and runs repository
# checks. ADORE does not accept a separately configured verification command.
[workflow]
mode = "auto"                      # auto detects AEGIS; direct skips it for new jobs
default_kind = "feature"
kind_labels = { bug = "fix", fix = "fix", change = "change" }
aegis_python = "python"
stage_timeout_overrides = {}        # e.g. { build = 2400, validate = 2400 }

[recovery]
max_stage_failures = 3
max_transient_retries = 3
retry_backoff_seconds = [5, 30, 120]

# Cumulative consumed work is retained across Retry and resume. Waiting uses no
# active-work time. Each executor attempt has its own timeout within the job limit.
[budgets]
max_iterations = 20
max_wall_clock_seconds = 3600
per_gate_timeout_seconds = 1800
max_cost_usd = 5.0                   # Reported-cost cap; 0 disables it
max_files_touched = 120

# ADORE opens a draft or ready MR/PR under the configured approval policy.
# A human merges. Remote WIP checkpoints are a separate project policy.
[delivery]
target_branch = "develop"
draft = true
# Example login. Name real accounts of your forge; an empty list requests no review.
reviewers = ["reviewer.one"]
remove_source_branch = true
approval_label = "agent-approved"
require_human_approval = true
publish_checkpoints = true

# A new failed pipeline can start a bounded revision round. Publication follows
# require_human_approval above. notify asks for intervention; ignore skips CI reads.
[review]
trigger = "label"
revise_label = "agent-revise"
max_review_rounds = 5
on_pipeline_failure = "revise"

[metrics]
enabled = true
db_path = ".adore/metrics.db"
export_jsonl = ".adore/metrics/runs.jsonl"
capture_tokens = true
html_out = ".adore/metrics/stats.html"

# Native local alternative: select backend = "local" in [execution], keep
# preparation empty and omit the [container] tables. Install project tools on
# the host; run adore pi install and adore pi verify under the service account.
# Linux also needs delegated cgroup v2 and ADORE_LOCAL_CGROUP_ROOT.
# Local execution shares the service account's host credentials and network.
