target-version = "py311"
line-length = 100
src = ["ador", "tests"]

[lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []

[lint.isort]
force-sort-within-sections = true

[format]
quote-style = "double"
