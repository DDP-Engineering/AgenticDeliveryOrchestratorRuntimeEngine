# User-facing release notes shown in About > What's new. Rules: AGENTS.md
# "Release notes rules"; check: python 02_Tools/internal/check_release_notes.py.
# One [[release]] per release, "Unreleased" first, then released versions
# newest first with the date of their CHANGELOG.md heading. Each entry has a
# category (new | improved | fixed), a short topic and a text of at most 100
# characters in en, fr, de and ro, in plain user language.

