# =============================================================================
# Generic tracked development configuration.
#
# This file intentionally names no real repository, account, image, or host.
# Copy and adapt it for a local runtime project, then validate before use:
#   adore -c config.toml config validate
# =============================================================================

[agent]
name = "ADORE"
slug = "adore"
email = "adore-bot@local"

[platform]
kind = "gitlab"
repo = "example-group/example-repository"

[worktree]
repo_path = "../runtime-project"
root = "worktrees"
branch_template = "adore/{run_id}"

[container]
runtime = "docker"
image = "adore-executor-base:1.0.0"
runtime_env = { UV_LINK_MODE = "copy" }

[executor]
default = "opencode"
env_keys = ["OPENAI_API_KEY", "ANTHROPIC_API_KEY"]
stage_host_auth = false

[executor.opencode]
command = "opencode run --dir {worktree} -m {model} --format json {prompt}"
model = "provider/model"

[workflow]
default_kind = "feature"
kind_labels = { bug = "fix", fix = "fix", change = "change" }
quick_label = "agent-quick"
aegis_python = "python"

[recovery]
max_stage_failures = 3
max_transient_retries = 3
retry_backoff_seconds = [5, 30, 120]

[budgets]
max_iterations = 12
max_wall_clock_seconds = 5400
max_cost_usd = 5.0
max_files_touched = 10

[clarification]
max_rounds = 2
reminder_after = "30m"
answer_timeout = "2h"

[delivery]
target_branch = "main"
reviewers = ["reviewer"]
approval_label = "agent-approved"

[polling]
mode = "once"
max_concurrent_runs = 1
