requirement = """
While the signed-in account must set a new password, the web interface shall show only a change-password form with the reason, language, theme and sign-out controls, and after a successful change it shall return to the sign-in page.
"""

verification = "Manual: as administrator reset a developer's password, sign in as that developer in each supported locale, confirm only the change-password form with reason, language, theme and Sign out is shown and the sidebar views are absent; submit a wrong current password and confirm the localized error with the form retained; submit a valid change and confirm the sign-in page, then sign in with the new password and see the dashboard."

