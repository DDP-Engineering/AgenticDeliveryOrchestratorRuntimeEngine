title = "Open projects and jobs from their names"

status = "active"

requirement = """
When a user activates a project name in the Projects table or a ticket link or Details/View action in a job table, the web interface shall open that project's details or that job in Jobs, and the project names and ticket links shall be links to those views' URLs so that a modified click opens them in a new browser tab.
"""

verification = "Manual: on Projects click a project name and confirm Project details opens; middle-click it and confirm a new tab at /projects/<id>; on Overview compact tables, Project details history and Jobs, activate a ticket link and a Details/View action and confirm Jobs opens with that job's details and a /jobs?project=<id>&run=<run> URL; confirm the Overview Project selector scopes both tables."

