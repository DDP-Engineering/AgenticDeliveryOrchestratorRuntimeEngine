title = "Open projects and jobs from their names"

status = "active"

requirement = """
When a user activates a project name in the Projects table or a ticket number or View action in any job table, the web interface shall open that project's details or that job in Jobs, and the names and ticket numbers shall be links to those views' URLs so that a modified click opens them in a new browser tab.
"""

