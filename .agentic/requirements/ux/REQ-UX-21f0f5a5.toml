title = "Name the labels a refused Start leaves on the ticket"
status = "active"
requirement = """
When a Start that added labels ends failed with a known refusal reason in the Tickets view, the notice shall name those labels and say in the user's locale that the ticket keeps them, that ADORE picks it up when its pickup rules allow, and that Stop removes them.
"""
verification = "Automated: a browser test where a mocked Start returning labels_added agent-ready and P1 whose operation then fails shows both label names with the kept-labels sentence; node tests of keptLabels name the labels for every known reason and none for a failed Start that added none, for a failure without a known reason (it may have started a job) and for pending, running, succeeded and uncertain outcomes."
