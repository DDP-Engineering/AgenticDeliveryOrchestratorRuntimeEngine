id = "REQ-UX-51b770d7"

title = "Keep Jobs project selection within page with ticket guidance"

status = "active"

requirement = """
On Jobs, the interface shall show authorized project selection beside the ticket/start controls inside page content, keeping the top header free of project selection. The ticket field shall provide localized Help describing the repository issue number, positive integer format and example. Changing the project clears the ticket draft; archived projects permit history selection without a start control. Empty, zero and fractional ticket values fail browser form validation. The existing API authorization and job eligibility rules remain in force.
"""

verification = "Manual: Inspect Jobs at desktop and 390px viewport and supported locales; open ticket Help, check positive and empty/zero/fractional native validation, change projects after entering a number, and select an archived profile. Offline API tests retain operation scope, CSRF, target and archived-project boundaries."

