title = "Organize project details into tabs with consistent navigation"

status = "active"

requirement = """
When a user opens a project's details, the web interface shall present Overview, Configuration and, for administrators, Prices as tabs with a visible selected state, and shall offer Jobs and Metrics for that project as links to those pages and, for administrators, a Manage access link to account management, so that every control styled as a tab switches content within Project details.
"""

verification = "Manual: as administrator and developer at desktop and 390px widths, open a project, switch each tab and confirm only that tab's content and selected state; confirm developers see no Prices tab or editing controls; follow Jobs, Metrics and Manage access links and confirm the destination view is scoped to the project; confirm the tab is reflected in the URL."

