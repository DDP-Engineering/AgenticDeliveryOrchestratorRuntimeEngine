title = "Show each Statistics per-project family in its own tab"

status = "active"

requirement = """
While an administrator views Statistics for All projects, the interface shall show one per-project table per metric family in its own tab - Summary: started, completed and failed jobs and average elapsed time; Usage: usage events, tokens, reported and estimated cost and unpriced usage events; Quality: reviewer rework, MR/PR revisions, pipeline repairs and review rounds - each project named with its repository as a hint, without a separate Projects tab, a repository table, project identifiers or a scope explanation line.
"""

verification = "Automated: e2e opens global Statistics as administrator and finds Summary, Usage, Quality and Trends tabs only (an old ?tab=projects link lands on Summary), no scope explanation, the Summary per-project table with job counts and average elapsed and no project identifier, the Usage per-project table with cost and unpriced columns, and the Quality per-project table with rework, revisions, repairs and review rounds; a route unit test normalizes tab=projects for administrators too."

