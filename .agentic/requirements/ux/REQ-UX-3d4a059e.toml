title = "Split the project Jobs tab into Tickets and Jobs sub-tabs"

status = "active"

requirement = """
While a user views a project's Jobs tab, the web interface shall offer a Tickets sub-tab, selected by default, that reads the project's open tickets only when the user presses Read tickets and lists them with number, title, labels, eligibility or job state, per-row Start (asking for confirmation and a priority when it must add labels), Retry for a failed job, Stop, and an expandable description with on-demand comments, with unavailable actions visibly disabled, and a Jobs sub-tab with the existing job search, filters, table and job detail.
"""

verification = "Automated: e2e opens a project's Jobs tab, sees the Tickets sub-tab selected with no tickets until Read tickets is pressed, then a table of fixture tickets with eligibility; expands a ticket to see its description and comments; Start queues an operation for an eligible ticket, ineligible tickets cannot be started, Stop reports cancel and label outcomes; the Jobs sub-tab shows the job table and a job detail URL opens it; unit tests parse/format the sub-tab URL."

