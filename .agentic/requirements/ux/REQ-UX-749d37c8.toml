schema = 1
id = "REQ-UX-749d37c8"
title = "Localized responsive web interface"
status = "active"
requirement = """When a user opens ADORE web, the interface shall offer English, French, German, and Romanian, light/dark/system themes, responsive layouts, and an About view with version and license. Authenticated presentation preferences shall persist per account across browsers, while browser preferences remain a fallback before login or when an account has no saved value. The About dialog shall keep keyboard focus within the dialog and restore it to the trigger on close; compact layouts shall keep Sign out available. Metrics shall keep shared period controls and role-scoped CSV exports above keyboard-operable category tabs. Administration shall show separate System status, Users, Audit and Settings sidebar entries; developers retain My account. Tables that can exceed ten rows shall provide 10, 25, 50 and All choices with finite-page navigation."""
verification = "Verify account-scoped preference persistence and schema upgrade, invalid/corrupt preference rejection, session and CSRF enforcement; build the frontend and manually inspect all four locale controls, dark/system themes, About focus trapping and restoration, compact Sign out, and 360px/1920px layouts in a browser. Inspect Metrics tabs, keyboard selection, compact controls, shared export query parameters and developer export visibility. Inspect administrator submenu navigation and long Audit paging; verify Jobs All and invalid limits through the API. Manual: Inspect selected-ticket Date/Event/Stage history with 0, 10, 11 and more than 50 events; verify 10/25/50/All, first/last page bounds, journal order, ticket switching reset, and phone/desktop table scrolling."
affected_paths = ["04_Software/web/", "04_Software/adore/web/static/", "04_Software/adore/web/app.py", "04_Software/adore/web/store.py", "02_Tools/stamp_web_assets.py"]
linked_tests = ["04_Software/tests/test_web_auth.py", "04_Software/tests/test_web_rbac.py"]
created = 2026-09-29
updated = 2026-10-01
