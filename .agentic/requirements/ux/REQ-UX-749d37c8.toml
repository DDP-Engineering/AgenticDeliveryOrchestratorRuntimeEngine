schema = 1

id = "REQ-UX-749d37c8"

title = "Localized responsive web interface"

status = "active"

requirement = "When a user opens ADORE web, the interface shall offer English, French, German, and Romanian, light/dark/system themes, responsive layouts, and an About view with version and license. Authenticated presentation preferences shall persist per account across browsers, while browser preferences remain a fallback before login or when an account has no saved value. The About dialog shall keep keyboard focus within the dialog and restore it to the trigger on close; compact layouts shall keep Sign out available. Metrics shall keep shared period controls and role-scoped CSV exports above keyboard-operable category tabs. Administration shall show separate System status, Users and Audit sidebar entries for administrators, and every signed-in user shall reach their own language, theme and password settings through a top-level My account entry. Tables that can exceed ten rows shall provide 10, 25, 50 and All choices with finite-page navigation. Selected-ticket timelines shall display latest recorded events first, in reverse journal order without altering saved history."

verification = "Browser tests cover the current responsive layout and English, French, German and Romanian interface controls. Release stamping is a delivery operation, outside product requirements."

affected_paths = ["04_Software/web/", "04_Software/adore/web/static/", "04_Software/adore/web/app.py", "04_Software/adore/web/store.py"]

linked_tests = ["04_Software/tests/test_web_auth.py", "04_Software/tests/test_web_rbac.py"]

