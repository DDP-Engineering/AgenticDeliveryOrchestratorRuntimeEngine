title = "Describe unverified direct published candidates"
status = "active"
requirement = "When publishing an approved direct candidate, the conductor shall include its retained implementation/check summary, changed-file count and the exact notice 'Verification: not configured. This candidate is unverified.' in the MR/PR body without an AEGIS task line."
verification = "Complete a direct run, reload saved state, freshly approve and publish with a fake forge, then inspect created, adopted and revised MR/PR bodies for the current retained summary/count/exact notice and candidate/target binding, with no AEGIS task line. Stale approval writes no revision; refused, timed-out or ambiguous description updates cannot enter review and explicit Retry repeats the same approved body without Pi. Inject runners for all three adapters to prove body-only literal fields, CLI failure/timeout refusal and Gitea HTTP status checks. AEGIS publication retains its existing body."
