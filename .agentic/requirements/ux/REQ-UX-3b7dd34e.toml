title = "Sort and page authorized projects with row actions"

status = "active"

requirement = """
On the Projects page, ADORE shall show each authorized project as a row in a sortable table with 10, 25, 50 and All pagination choices when more than ten rows exist. Administrators shall have per-row pickup, archive/restore and detail actions, while developers shall have a detail action only. The page shall not show a top-bar project selector, search field, status filter, project cards or a separate selected-project action panel.
"""

verification = "Manual: Open Projects as administrator and developer, sort each column in both directions, select different page sizes with more than ten projects, use each authorized row action on a safe test profile, and verify the top bar and old controls are absent at desktop and narrow widths."

