schema = 1

id = "REQ-UX-cbca5fd9"

title = "Record validated refresh completion time"

status = "active"

requirement = """
When Statistics, jobs/detail/consumption, audit or Users completes a successful validated current-context read or complete reporting refresh, the interface shall expose the recorded successful completion time as freshness feedback, without advancing it on request start, failure, partial reporting completion or ignored response.
"""

verification = "Offline browser with a controlled clock: complete a good read, hold the next Refresh, fail it, then resolve a valid retry; assert the displayed completion time changes only after successful publication, including unchanged data; resolve reporting members separately and verify no whole-report success time appears before the complete coordinated replacement. Malformed run collections/rows/counts and optional revision collections/rows/identities/values, cost-efficiency collection/entry/count/money evidence and pooled weighted/count overflow in initial and replacement global or selected-project Admin Quality reads expose error/Retry without report, exports, a success time or pageerror; a valid retry restores success. Initial and replacement Usage reads also reject malformed/null/negative/fractional/unsafe optional unpriced-event counts and pooled sum overflow before report/exports/time publication, with no pageerror and valid known/zero/absent recovery in global, global-selected and project-hub scopes. Unsafe pooled lifecycle/stock/total/day/quality/coverage/review counters and duration sums also fail before any report/exports/success time, despite individually valid project inputs; safe-boundary and valid recovery remain accepted. Mixed known/absent unpriced counts retain unknown pooled evidence through successful initial/replacement publication."

