title = "Paginate the Tickets table with a rows-per-page selector"

status = "active"

requirement = """
When a Tickets table holds more than 10 tickets, the web interface shall show them in pages of 10 by default with a Rows per page selector (10, 25, 50, All), the visible range, the current page number of the page count and Previous/Next controls, returning to the first page when tickets are read again.
"""

verification = "Automated: e2e tickets.spec reads 23 tickets, sees 10 rows and page 1 of 3, moves with Next/Previous, switches to 25 and All rows, and sees no pager for 7 tickets."

