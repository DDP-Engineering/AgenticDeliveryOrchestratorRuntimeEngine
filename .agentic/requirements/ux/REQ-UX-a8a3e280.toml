title = "Show explicit audit retention limits in the form"

status = "active"

requirement = """
The Audit retention form shall display saved day and MiB limits, using zero for each unlimited limit. Saving zero or blank shall preserve unlimited retention; positive inputs shall map to bounded integer days and byte limits, and invalid inputs shall be rejected before a policy request. Saved responses and reopening the page shall repopulate current policy values.
"""

verification = "Manual: Open a disposable Audit page, inspect zero defaults, save 30 days/64 MiB and reopen/reload, then reset zero and inspect persistence; verify negative/native bounds. Offline frontend tests prove numeric payload conversion and invalid input rejection; existing audit API tests prove RBAC, CSRF, persisted policy and corruption boundaries."

