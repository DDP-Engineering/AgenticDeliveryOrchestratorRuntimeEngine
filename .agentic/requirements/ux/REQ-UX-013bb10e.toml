title = "Preserve reading continuity during revalidation"

status = "draft"

requirement = """
While a web view's focused control or selected text and its owning authorized item still exist during same-context revalidation, the interface shall preserve reading continuity through keyboard focus, text selection and page or local scroll position without programmatically stealing focus.
"""

verification = "Offline browser: focus a Usage pager or audit filter, select clarification/output text and scroll a long job detail/local code region, then hold and complete parent and resource rereads; assert the same focused DOM element, selection and scroll offsets persist; context removal instead follows its explicit transition without focusing a detached control."

affected_paths = ["04_Software/web/src/App.tsx", "04_Software/web/src/JobWorkspace.tsx", "04_Software/web/src/AuditHistory.tsx", "04_Software/web/src/styles.css"]

