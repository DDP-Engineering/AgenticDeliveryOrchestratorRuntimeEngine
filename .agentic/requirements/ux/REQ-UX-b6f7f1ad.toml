title = "Show initial informational read failure"

status = "draft"

requirement = """
If an informational web read fails without a successfully validated snapshot for its current context, the interface shall show an explicit initial-read error without prior-context evidence or fabricated numeric values.
"""

verification = "Offline browser: fail the first Statistics, Jobs/detail/consumption or audit read, and fail the first read after changing context; assert explicit error, absent old data, totals and exports rather than empty/zero or a stale-success timestamp; a valid retry can populate the new context."

