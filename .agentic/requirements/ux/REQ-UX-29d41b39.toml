title = "Show the global Jobs page like the project hub Jobs tab"

status = "active"

requirement = """
While a user views the global Jobs page, the interface shall show one compact project selector row and the same Tickets and Jobs sub-tabs as the project hub (Tickets by default, the Jobs sub-tab addressable with view=jobs and opened by a run link); for All projects, Read tickets reads every authorized active project's open tickets into one table with a Project column whose actions act on that row's project and reports a failed project read per project, without a ticket-number start form or scope and worker explanations, showing worker status only when the worker is unavailable or failing.
"""

verification = "Automated: e2e opens /jobs (All projects: Tickets sub-tab selected, no ticket-number form, no Worker available or scope help), fails one project's ticket read and sees only that project's error beside the other project's rows, reads All projects tickets (Project column, rows from several projects, Start posts to the row's project), switches to Jobs (view=jobs, table) and reloads, selects a project (Tickets without a Project column), and opens a run link in the Jobs sub-tab; manual start, queue and asynchronous outcome tests start tickets from the Tickets sub-tab; unit tests parse/format view=jobs."

