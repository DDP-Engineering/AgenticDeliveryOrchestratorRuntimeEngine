requirement = """
When a user operates any web journey at compact, wide, short-height or 200-percent zoom viewports, ADORE web shall keep primary actions, status and chart alternatives perceivable and keyboard-operable across English, French, German and Romanian, with visible focus, labeled controls, adequate contrast and reduced-motion behavior.
"""

