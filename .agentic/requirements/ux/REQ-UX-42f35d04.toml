id = "REQ-UX-42f35d04"

title = "Single transient operation notification"

status = "active"

requirement = """
The GUI presents at most one dismissible ordinary or operation notification, updating the operation status in place. Pending and running operations remain visible until dismissed or completed. Successful and ordinary notices disappear after five seconds. Failed and uncertain outcomes remain visible until dismissed. Dismissal keeps operation polling active, and replacement cancels older dismissal timers.
"""

verification = "Offline Chromium tests cover timed dismissal of success, explicit dismissal of failure, pending polling after dismissal, and replacement timer ownership."

