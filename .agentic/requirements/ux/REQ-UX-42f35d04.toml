requirement = """
The GUI presents at most one dismissible ordinary or operation notification, updating the operation status without a duplicate queued banner. Pending/running operations remain visible until dismissed or completed; terminal and ordinary notices disappear after five seconds. Dismissal never cancels operation polling, and replacement cancels older dismissal timers.
"""

