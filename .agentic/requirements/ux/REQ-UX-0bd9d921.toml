schema = 1

id = "REQ-UX-0bd9d921"

title = "Transition explicitly when a displayed identity disappears"

status = "draft"

requirement = """
When a validated web refresh establishes that a displayed project, account, job or row no longer exists in the selected context, the interface shall use an explicit unavailable, removed-item or existing safe navigation transition rather than retaining the vanished identity as current or substituting a different identity beneath its heading.
"""

verification = "Offline browser: remove a selected project/job/account or an expanded audit row from a validated reread and assert no orphaned detail/action remains under its old heading; archive a project and observe archived history with action restrictions rather than treating archive as deletion; unchanged identities preserve their view state."

