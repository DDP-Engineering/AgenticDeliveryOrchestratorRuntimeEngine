id = "REQ-UX-e6ed7168"

title = "Display localized web error messages"

status = "active"

requirement = """
When a web request fails, the web interface shall display the message for the returned error code in the selected language, followed by any diagnostic detail, and if the code has no message it shall display a localized generic failure message that names the code.
"""

verification = "Automated: a frontend test asserts that every error code the API source can emit has a non-empty message in English, French, German and Romanian, and that an unknown code yields the localized generic message containing the code. Manual: create a project named My Project via the API-backed form with browser validation bypassed, and confirm the banner shows the localized sentence instead of invalid_project_name in each locale."

