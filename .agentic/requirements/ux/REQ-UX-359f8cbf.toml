requirement = """
While an administrator enters a project name on Add project or Import project, the web interface shall block submission of a name that is not 1 to 64 characters starting with a lowercase letter or digit followed by lowercase letters, digits, dots, underscores or hyphens, showing the browser's validation message without sending a request.
"""

verification = "Automated: a frontend test compiles the shared name pattern with the v flag as browsers do and checks that demo, a.b_c-1 and a 64-character name are accepted while My Project, -demo, an empty name and a 65-character name are rejected. Manual: in Chrome, enter My Project on Add project and Import project and confirm the browser message appears and no request is sent."

