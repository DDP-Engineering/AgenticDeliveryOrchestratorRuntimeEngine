title = "Preserve unchanged valid reviews during unrelated refresh"

status = "draft"

requirement = """
When an unrelated or unchanged successful web refresh leaves a Settings, Access, Users or ticket form, review or confirmation's underlying identity, revision and authority valid, the interface shall preserve that local form or review state and its entered draft rather than closing or overwriting it.
"""

