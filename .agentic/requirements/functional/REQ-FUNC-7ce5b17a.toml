schema = 1
id = "REQ-FUNC-7ce5b17a"
title = "Web project configuration and status"
status = "active"
requirement = """When an administrator configures a project or a signed-in user opens its status, ADORE web shall validate and persist non-secret project settings and display current profile, run lifecycle, and stage for authorized projects without changing in-flight run state. The project directory shall search and filter only authorized projects, display static configuration state, executor and UTC last activity, and fail closed on malformed persisted activity timestamps. The Jobs view shall page project runs with lifecycle, stage, UTC last-update date and bounded outcome-text filters, enforcing the project grant and a bounded response. For OpenCode, one OpenAI-compatible endpoint edit shall atomically configure the selected provider/model and URL override; other executors shall reject that edit. CLI and web configuration edits shall coordinate through a local process lock and reject contention without changing the file. Administrators shall archive and restore quiescent projects without deleting run, metric, price or audit history; archive rejects active or corrupt state and queued work, and archived profiles shall not accept web operations or named/active-profile CLI pickup. Administrators shall preview and import a bounded, validated existing TOML configuration without rewriting it, rejecting embedded secret values, ambiguous relative or shared state paths, stale revisions and active work, then start pickup paused while retaining existing completed run state."""
verification = "Verify bounded Windows replace contention and retained review on persistent/unrelated write errors. Verify valid configuration and status display, scoped run pages and filters including UTC offset boundaries and case-insensitive outcomes, invalid bounds/date ranges/outcome queries and corrupt state rejection, atomic OpenCode model/URL override, invalid-model and non-OpenCode rejection, stale revision rejection, concurrent CLI/web lock contention, archived history visibility, administrator/CSRF restrictions, active-run and queued-work conflict, malformed archive metadata, worker rejection and CLI pickup refusal. Verify exact TOML import and retained completed history, preview revision, malformed/secret/relative/shared-path rejection, active-state/lock rejection, and import RBAC/CSRF."
affected_paths = ["04_Software/adore/web/app.py", "04_Software/adore/web/store.py", "04_Software/adore/web/commands.py", "04_Software/adore/profiles.py", "04_Software/adore/config_edit.py", "04_Software/adore/cli.py", "04_Software/adore/config.py", "04_Software/adore/wizard.py", "04_Software/web/src/App.tsx", "04_Software/web/src/errors.ts"]
linked_tests = ["04_Software/web/tests/errors.test.mjs", "04_Software/web/e2e/jobs.spec.ts", "04_Software/tests/test_web_config.py", "04_Software/tests/test_web_pending_config.py", "04_Software/tests/test_web_readiness.py", "04_Software/tests/test_web_rbac.py", "04_Software/tests/test_web_archive.py", "04_Software/tests/test_web_import.py", "04_Software/tests/test_web_projects.py", "04_Software/tests/test_config.py", "04_Software/tests/test_wizard.py"]
