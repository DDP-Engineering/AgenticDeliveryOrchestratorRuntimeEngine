title = "Usage backfill and coverage from retained journals"

status = "active"

requirement = """
When an operator rebuilds web analytics from retained journals and terminal summaries, ADORE shall reconstruct idempotent usage and coverage history keyed by the usage event IDs without changing execution state or inventing unreported model or cost evidence, and shall refuse a usage event without its versioned event ID or current fields.
"""

verification = "Replay fixture histories twice and compare project/repository/run totals, coverage and source identities (the usage event IDs) before and after; verify unreported values remain unknown, a usage event without an event ID and conflicting events fail closed, and run state bytes are unchanged."

affected_paths = ["04_Software/adore/web/store.py", "04_Software/adore/web/app.py", "04_Software/adore/metrics.py"]

linked_tests = ["04_Software/tests/test_web_metrics.py", "04_Software/tests/test_web_auth.py"]


