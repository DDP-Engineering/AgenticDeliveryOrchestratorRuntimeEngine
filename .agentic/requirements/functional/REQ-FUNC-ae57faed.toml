title = "Write Pi's models.json for an OpenAI-compatible endpoint"

status = "active"

requirement = """When a container stage or Test AI connection runs with `provider = "custom"`, ADORE shall write Pi's models.json into the ADORE-owned agent directory with one provider `adore-endpoint` holding the configured base URL, API type, the configured model and the key reference `$ADORE_ENDPOINT_API_KEY` when that key is set or the literal placeholder `adore-no-key` when it is not."""

verification = "A fake-process launch for a custom endpoint checks the written models.json (with and without a key) and the copy into the agent directory before Pi starts; an API-key provider writes none; a failed copy fails the stage without starting Pi."

affected_paths = ["04_Software/adore/pi_providers.py", "04_Software/adore/executor/launcher.py", "04_Software/adore/web/model_connection.py", "04_Software/adore/orchestrator.py"]

