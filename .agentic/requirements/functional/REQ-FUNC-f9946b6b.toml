id = "REQ-FUNC-f9946b6b"
title = "Developer job controls"
status = "active"
requirement = """When an authorized user starts, retries, or cancels a job in an assigned project, ADORE web shall use the existing conductor rules, persist and report the operation without bypassing readiness, locks, or publication approval. During any blocking worker command or project poll, a pending cancellation in any project shall be signalled only after worker-side grant recheck, interrupt the matching working executor gate when active, and then follow normal conductor teardown. Only administrators may pause or resume project pickup. Failed manual admission shall report an allowlisted concrete reason bound to the selected ticket and actual CLI exit outcome, without forwarding arbitrary CLI output or secrets. Explicit Retry reports a bound run/exit/reason outcome and any newly persisted terminal job cause, returning failure when re-arming immediately fails rather than claiming success."""
verification = "Verify authorized controls, rejected cross-project and ineligible actions, idempotent submission, worker-side revocation, cross-project cancel signalling during a busy poll or command, prompt gate interruption, cancelled-operation reconciliation, and uncertain outcome after interruption. Offline CLI/worker tests bind allowlisted outcomes to ticket or Retry job identity and process exit, reject malformed, duplicate, unknown and oversized output without secret leakage, preserve timeout uncertainty and render localized reasons in four languages."
