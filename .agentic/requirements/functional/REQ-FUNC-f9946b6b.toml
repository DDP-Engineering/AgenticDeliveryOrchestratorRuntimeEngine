title = "Developer job controls"
status = "active"
requirement = """When an authorized user starts, retries, or cancels a job in an assigned project, ADORE web shall use the existing conductor rules, persist and report the operation without bypassing readiness, locks, or publication approval. During any blocking worker command or project poll, a pending cancellation in any project shall be signalled only after worker-side grant recheck, interrupt the matching working executor gate when active, and then follow normal conductor teardown. Only administrators may pause or resume project pickup."""
verification = "Verify authorized controls, rejected cross-project and ineligible actions, idempotent submission, worker-side revocation, cross-project cancel signalling during a busy poll or command, prompt gate interruption, cancelled-operation reconciliation, and uncertain outcome after interruption."
