title = "Persist Direct implementation completion before validation settlement"

status = "active"

requirement = "When a Direct implementation attempt settles successfully, makes product progress and has no blocking questions, the conductor shall durably record completed implementation and enter validate before checkpointing the candidate and reaching done. Recovery after that durable completion shall settle the candidate without launching another implementation."

