title = "Report the server's ChatGPT sign-in status"

status = "active"

requirement = """When an administrator reads the ChatGPT sign-in, ADORE shall report, from the credential directory and without starting Pi, `signed-in` for a stored OpenAI OAuth credential, `not-signed-in` when none is stored, and `sign-in-again` when the credential cannot be read or its last refresh was refused, together with whether a sign-in is pending."""

verification = "Unit and API tests with fake credential files: no auth.json and an auth.json without openai give not-signed-in; a well-formed oauth entry gives signed-in; a malformed file, an entry without a refresh token and the sign-in-again mark give sign-in-again."

affected_paths = ["04_Software/adore/chatgpt.py", "04_Software/adore/web/app.py"]

