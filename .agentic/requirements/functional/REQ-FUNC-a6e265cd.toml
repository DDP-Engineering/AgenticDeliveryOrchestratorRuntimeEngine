title = "Persist the exact enrollment verification command"
status = "draft"
requirement = "When an administrator confirms a valid reviewed enrollment with an optional verification command, ADORE shall save that exact string as workflow.verify_command in the project's TOML configuration, with omission equivalent to the empty string and without trimming, coercion or execution during enrollment."
verification = "Offline enrollment API and browser tests preview, review and create with omitted, empty and single-line commands containing spaces, quotes, backslashes, shell operators, dollar signs and Unicode, then load the saved TOML and compare exact values; changing the command after review invalidates the reviewed revision, and invalid command text publishes no project."
affected_paths = ["04_Software/adore/web/app.py", "04_Software/adore/web/implementation_settings.py", "04_Software/web/src/EnrollmentWizard.tsx"]
linked_tests = ["04_Software/tests/test_web_enrollment.py::test_enrollment_verification_command_is_exact_and_review_bound", "04_Software/tests/test_web_enrollment.py::test_enrollment_verification_command_rejects_invalid_text"]
spec = ""
priority = "high"
rationale = "The inherited runtime ignores this setting for AEGIS; enrollment saves configuration rather than running verification."
