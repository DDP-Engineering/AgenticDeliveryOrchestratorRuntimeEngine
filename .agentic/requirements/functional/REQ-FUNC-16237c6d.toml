title = "Validate AEGIS tasks and strict check evidence"

status = "active"

requirement = "The AEGIS client shall validate current task identity, stage transitions along the single frame-to-done stage order and internally consistent status/check evidence against its supported protocol contract. Unsupported stages or malformed external documents shall raise typed protocol errors. The conductor shall follow the observed executor-owned journal progression and candidate approval boundary."

verification = "Exercise task creation/status for journals with and without a legacy path header line, permitted forward/backward transitions along the single stage order and strict-check document parsing through injected commands. Refuse unknown stages, wrong task identity, malformed journals and contradictory check counts without treating them as successful execution."

