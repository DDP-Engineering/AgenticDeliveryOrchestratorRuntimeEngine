title = "Refuse ChatGPT for a local run or a stage limit beyond the token life"

status = "active"

requirement = """If a configuration with `[executor] provider = "chatgpt"` sets `[execution] backend = "local"`, `[budgets] per_gate_timeout_seconds` above 3000 or a `[workflow] stage_timeout_overrides` entry above 3000, then ADORE shall refuse it with a message naming that key, because a ChatGPT access token lasts about an hour and is refreshed only between stages."""

