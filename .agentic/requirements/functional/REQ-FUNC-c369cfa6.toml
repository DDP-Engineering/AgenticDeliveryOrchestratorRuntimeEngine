id = "REQ-FUNC-c369cfa6"

title = "Stable web project identity"

status = "active"

requirement = """
When a web project is created, imported, or relabeled, ADORE web shall retain an immutable project identifier for its grants, commands, history and API references independently of the profile display name; replacing a profile or reusing its name must not inherit another project's access.
"""

verification = "Create and import projects, grant a developer one project, relabel that project, and verify its ID, grant, command scope and history persist. Replace a profile under an old name and verify the former grant cannot access it; reject duplicate or corrupt IDs and preserve legacy history during migration."

