title = "End a sign-in that OpenAI refuses with a localized cause"

status = "active"

requirement = """If OpenAI refuses the sign-in (the redirect address carries an error, or the code exchange fails), then ADORE shall end the pending sign-in, keep the stored credential unchanged and answer with one cause code - chatgpt_not_eligible for an account that cannot share its subscription (`subscription_sharing_user_not_eligible`), chatgpt_access_denied, chatgpt_code_rejected, chatgpt_sign_in_unavailable or chatgpt_sign_in_refused - that the interface shows as one sentence in English, French, German and Romanian."""

verification = "API tests: a redirect with error=access_denied and with error=subscription_sharing_user_not_eligible, and a fake helper answering not-eligible, code-rejected and unavailable each give their code and end the pending sign-in; web unit test: every code has a sentence in the four locales."

