schema = 1

id = "REQ-FUNC-116450ef"

title = "Run a container Pi stage through one RPC process"

status = "active"

requirement = """When the orchestrator launches a stage with the Pi executor on a container target, ADORE shall start one `pi --mode rpc --no-session` process in the worktree, keep its stdin open, send the stage prompt as one RPC prompt command, read events until `agent_settled`, close stdin, and report the launch as successful when the prompt started a run, the run was not aborted and its last assistant message did not end with stopReason `error`, regardless of the process exit code."""

verification = "A fake Pi process replaying the recorded tool-call run receives the prompt command, the launch returns exit 0 with no timeout, and a replay whose process exits non-zero after a clean `agent_settled` still succeeds."

affected_paths = ["04_Software/adore/executor/pi_rpc.py", "04_Software/adore/executor/launcher.py", "04_Software/adore/executor/base.py", "04_Software/adore/isolation.py", "04_Software/adore/execution.py", "04_Software/adore/branding.py"]

