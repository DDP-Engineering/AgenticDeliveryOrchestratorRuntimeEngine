id = "REQ-FUNC-67bd56c8"

title = "Publish an approved candidate without an executor session"

status = "active"

requirement = """
When the conductor accepts a fresh approval for the presented candidate, it shall push the candidate and open or adopt its draft or ready MR/PR without launching an executor session or running an AEGIS command.
"""

verification = "An offline publication test approves a verified candidate at stage done and observes one branch push, the configured draft or ready MR/PR, an in-review run at stage done, and no executor prompt or AEGIS client call after approval; a failed push fails the run with PUSH_FAILED and keeps the approval evidence for retry."

affected_paths = ["04_Software/adore/orchestrator.py", "04_Software/adore/aegis.py", "04_Software/adore/isolation.py"]

linked_tests = ["04_Software/tests/test_orchestrator.py::test_direct_one_session_reaches_unverified_approval_and_publication", "04_Software/tests/test_orchestrator.py::test_direct_publication_and_review_boundaries", "04_Software/tests/test_orchestrator.py::test_approved_publication_opens_draft_without_an_executor_session", "04_Software/tests/test_orchestrator.py::test_publication_adopts_existing_open_mr_before_create", "04_Software/tests/test_orchestrator.py::test_failed_publication_push_keeps_the_approval_for_retry", "04_Software/tests/test_checkpoint_handoff.py::test_checkpoint_handoff_delivery_still_requires_fresh_approval"]


