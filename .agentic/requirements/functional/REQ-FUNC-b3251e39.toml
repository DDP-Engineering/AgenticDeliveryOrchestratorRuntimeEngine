title = "Enroll a project from its repository URL and clone it at creation"

status = "active"

requirement = """
When an administrator confirms a valid reviewed repository-URL enrollment, ADORE shall create the project using the selected existing target branch in a new or matching-origin local clone, irrespective of the presence of .agentic/aegis.py or .agentic/aegis.toml, within the validated URL, clone-ownership and failure-cleanup boundaries.
"""

verification = "Offline repository-source/API/browser tests create stopped projects from fake clones without AEGIS, with aegis.py alone and with both files, and compare clone contents to prove no added files; existing-clone reuse succeeds only for matching origin. Preserve URL/kind/login/ID and all-forge branch-discovery cases, preview/check no-clone-write assertions, and negative occupied-folder, malformed/oversized remote advertisement, missing-target-branch and failed-publication cleanup cases described in the spec."

