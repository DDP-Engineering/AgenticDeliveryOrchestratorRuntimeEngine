id = "REQ-FUNC-448cbde7"
title = "Web metrics and usage history"
status = "active"
requirement = """When an authorized user views project metrics, ADORE web shall report run and token trends from durable evidence while showing unknown usage and cost distinctly. An inclusive UTC date range shall scope daily rows and CSV exports and provide dated-event period totals separately from all-time headline totals. Terminal job duration shall report its sample count, average and median elapsed seconds from valid start/end evidence, with a separate sample scoped by UTC completion day; undated summaries shall not count as zero. A separate attributed usage view and CSV shall filter dated usage events by exact executor and model without implying that job counts or legacy summary-only usage have that identity. Reviewer-requested MR/PR revisions and automatic pipeline repairs are distinct daily counts; unknown triggers remain unclassified. All-time quality ratios shall count distinct evidence-backed jobs with explicit review, validation and human-merge denominators, and use null for empty cohorts. Administrators can add immutable dated project/executor/model prices to estimate token-only usage; estimates remain separate from provider-reported costs. Administrator metrics attribute post-revision-start usage to each revision while initial work stays in run totals. Versioned launch usage shall be idempotent across summaries and web views, and conflicting replay shall fail closed. Monetary views are administrator-only."""
verification = "Verify per-project and global UTC date ranges, separate period and all-time totals, date-bound CSV exports, terminal duration coverage/averages/medians and corrupt-span rejection, executor/model filtered project and global attributed usage, malformed/reversed range rejection, spreadsheet-safe identities, corrupt stored identity and non-object journal rejection, per-project daily counts, separate reviewer and pipeline revisions, evidence-backed quality cohort ratios and empty denominators, bad validation-verdict rejection, per-revision usage and nullable reported/estimated cost, unclassified revision coverage, effective-dated estimates, reported/estimated separation, known and unknown usage, no duplicate aggregation, price validation and migration, and developer cost denial."
affected_paths = ["04_Software/adore/web/app.py", "04_Software/adore/web/store.py", "04_Software/adore/executor/base.py", "04_Software/adore/executor/launcher.py", "04_Software/adore/orchestrator.py", "04_Software/adore/metrics.py", "04_Software/adore/cli.py", "04_Software/web/src/App.tsx", "04_Software/web/src/i18n.ts"]
linked_tests = ["04_Software/tests/test_web_metrics.py", "04_Software/tests/test_web_pricing.py", "04_Software/tests/test_executor.py", "04_Software/tests/test_metrics.py", "04_Software/tests/test_smoke.py", "04_Software/tests/test_orchestrator.py"]
