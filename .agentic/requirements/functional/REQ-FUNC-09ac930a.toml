id = "REQ-FUNC-09ac930a"

title = "Start Sign in with ChatGPT from a container project"

status = "active"

requirement = """When an administrator starts Sign in with ChatGPT from a project whose `[execution] backend` is `container`, ADORE shall start Pi's OpenAI sign-in ("Sign in with ChatGPT") in a temporary helper container from that project's image, with only the server's ChatGPT credential directory mounted, keep it waiting for the redirect address for at most 15 minutes, and return the authorization link; a second start replaces a pending sign-in, and a project with `backend = "local"` is refused with chatgpt_sign_in_container_required."""

verification = "API test with a fake Pi helper: POST start returns the authorization link and the helper argv mounts only the credential directory; a second start ends the first helper; a local-backend project gets 409 chatgpt_sign_in_container_required; a helper that cannot run gives 503 chatgpt_helper_failed and one that shows no link in time gives unavailable."

affected_paths = ["04_Software/adore/chatgpt.py", "04_Software/adore/web/app.py", "04_Software/adore/isolation.py", "04_Software/docker/pi/adore-chatgpt.mjs"]

