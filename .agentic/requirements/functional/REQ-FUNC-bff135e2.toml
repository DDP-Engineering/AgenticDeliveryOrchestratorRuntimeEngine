title = "Settle timed-out container commands before reuse"

status = "active"

requirement = "When a bound container command reports a timeout, the execution backend shall quiesce that command's remaining container processes before admitting a subsequent bound command."

verification = "Offline public bound-target tests inject a timeout and observe verified quiescence before later execution; ordinary completion and a normal exit 124 do not trigger timeout recovery. Controlled disposable Docker acceptance confirms the original timed-out writer is absent before a later command."

