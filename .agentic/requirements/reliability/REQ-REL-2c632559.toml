schema = 1

id = "REQ-REL-2c632559"

title = "Fail direct attempts without product progress"

status = "active"

requirement = "For each Direct implementation attempt, ADORE shall compare exact tracked Git diff bytes and untracked file/path bytes while excluding declared bookkeeping. Arbitrary file content, replacement characters, non-UTF-8 data and large diffs shall remain valid progress input. A successful attempt without product progress shall fail explicitly; command failure or unsafe filesystem evidence shall not become a false no-change result."

verification = "Injected command captures distinguish invalid byte sequences with identical display text, observe untracked binary changes and excluded bookkeeping, and refuse failed commands, malformed captures and unsafe or unreadable paths."

affected_paths = ["04_Software/adore/orchestrator.py"]

linked_tests = ["04_Software/tests/test_orchestrator.py::test_direct_no_changes_fails_once_with_summary", "04_Software/tests/test_orchestrator.py::test_direct_one_session_reaches_unverified_approval_and_publication"]

spec = ""

priority = "high"

rationale = "A summary alone cannot satisfy the ticket implementation goal."

