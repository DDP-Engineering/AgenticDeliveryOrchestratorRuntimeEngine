id = "REQ-REL-12a357a9"

title = "Keep authority-bearing reads fail closed"

status = "draft"

requirement = """
If an authority-bearing Users, Access, configuration, approval or operational-action read fails, the web interface shall withhold affected authority-bearing evidence and dependent mutation controls behind explicit error or unavailable feedback rather than reuse previous data as current authority.
"""

verification = "Offline browser: fail initial, manual and post-mutation Users/Access/configuration reads with transport, typed server and malformed errors; assert explicit failure and withheld affected evidence/dependent actions rather than stale-enabled grants/approvals; pending reads and independent informational consumption errors do not blanket-clear unrelated valid drafts."

