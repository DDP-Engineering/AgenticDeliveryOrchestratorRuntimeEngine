schema = 1
id = "REQ-REL-94e653aa"
title = "Preserve DCP checkpoint, handoff, and subscription budget semantics"
status = "active"
requirement = """The state store shall load valid persisted checkpoint fields without discarding them and fail closed on malformed checkpoint identities. Profiles use enabled checkpoint publication by default and preserve explicit false; when enabled, the conductor may push owned work-in-progress commits to its ticket branch under an exact remote lease, and shall follow the configured candidate-bound human approval policy before draft or ready MR/PR creation. A remote ownership conflict shall stop autonomous execution. An operator's human handoff shall durably transfer ownership at a safe boundary, preserve the worktree, and prevent later automated execution or cancellation. Web history shall show pending and completed handoffs, and shall treat completed handoffs as terminal for metrics, archive, and job controls. A configured cost cap of zero shall disable reported-cost enforcement for subscription-backed executors while leaving all other run limits active; invalid or negative caps shall be rejected."""
verification = "Offline tests load checkpoint-bearing state, reject malformed checkpoint digests and markers, exercise guarded pushes and remote conflict/retry, prove repeated idle polls leave a verified failed checkpoint and its history timestamp unchanged, prove later checkpoint events do not redate completed-job trends, prove handoff crash recovery and no pre-approval MR/PR, verify zero and invalid cost caps, and verify cancel/worker/API treatment of handoff states. On DCP, verify all six real project history and metrics endpoints through HTTPS."
affected_paths = ["04_Software/adore/state.py", "04_Software/adore/config.py", "04_Software/adore/isolation.py", "04_Software/adore/orchestrator.py", "04_Software/adore/cli.py", "04_Software/adore/wizard.py", "04_Software/adore/metrics.py", "04_Software/adore/web/app.py", "04_Software/adore/web/commands.py", "04_Software/web/src/App.tsx", "04_Software/web/src/i18n.ts", "04_Software/web/src/styles.css", "04_Software/config.example.toml"]
linked_tests = ["04_Software/tests/test_checkpoint_handoff.py", "04_Software/tests/test_config.py", "04_Software/tests/test_isolation.py", "04_Software/tests/test_orchestrator.py", "04_Software/tests/test_state.py", "04_Software/tests/test_web_archive.py", "04_Software/tests/test_web_commands.py", "04_Software/tests/test_web_metrics.py"]
