schema = 1

id = "REQ-REL-9e0b2628"

title = "Cancel invalidated view reads"

status = "draft"

requirement = """
When navigation, context invalidation, sign-out or unmount ends a web read's ownership, the interface shall cancel its owned requests and scheduling so the obsolete view produces no further read or publication side effects.
"""

verification = "Offline fake-clock/browser: navigate/unmount/sign out while each affected resource is held, observe its request cancellation and stopped timers/listeners, then advance time and release held responses; assert no obsolete reads, data, focus changes or error/freshness updates; a newly mounted authorized view reads normally."

