title = "Revalidate once when a hidden view becomes visible"

status = "draft"

requirement = """
When a periodically refreshed web view becomes visible after being hidden, the interface shall request one immediate coalesced revalidation for each eligible current resource and resume its normal cadence without duplicate visibility-event bursts or bypassing edit/mutation guards.
"""

verification = "Offline fake-clock/browser: hide a loaded view for several intervals, show it, and observe one immediate request per eligible resource plus normal subsequent cadence; repeated visible events or an already-held read cannot multiply requests, and dirty Settings or pending mutations remain guarded."

