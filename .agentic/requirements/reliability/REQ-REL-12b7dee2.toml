title = "Fail closed on a broken Pi protocol stream"

status = "active"

requirement = """If the Pi process exits before `agent_settled`, cannot be started, or writes a stdout record that is not a JSON object, or its last assistant message cannot be read within the record limit, then ADORE shall end the process and report a failed launch whose evidence names the protocol failure."""

