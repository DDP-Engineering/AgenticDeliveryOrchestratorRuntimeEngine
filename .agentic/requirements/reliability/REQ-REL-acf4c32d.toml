status = "active"

requirement = """When two ChatGPT stages request an access token at the same time, ADORE shall let both helpers use the same mounted credential directory, so Pi's lock (`auth.json.lock` beside `auth.json`) serializes the refresh, and the stored credential shall remain one valid OAuth credential after both requests."""

verification = "Fake-process test: two concurrent token requests against a fake Pi that locks auth.json.lock and rotates an expiring credential leave valid JSON, one rotation and the same token for both; Manual: one live check with two concurrent ChatGPT token requests, recorded in the ticket comment."

