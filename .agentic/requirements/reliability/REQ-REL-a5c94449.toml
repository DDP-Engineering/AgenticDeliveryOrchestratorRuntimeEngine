id = "REQ-REL-a5c94449"

title = "Reject other informational refresh failures"

status = "draft"

requirement = """
If a same-context informational web refresh fails with an application or unclassified error other than the separately identified authorization, invalid-evidence, missing-identity, incomplete or snapshot-conflict cases and is not positively classified as transport/deadline failure, the interface shall withhold the affected snapshot and dependent evidence behind explicit error feedback rather than guess a stale-retention exemption.
"""

verification = "Offline browser: after valid Statistics/jobs/audit data, return a typed nontransport application error, unknown HTTP failure code or unclassified exception; assert explicit error and absent affected numeric/export/action evidence; a positively identified transport failure instead produces the deliberately marked stale informational state."

affected_paths = ["04_Software/web/src/App.tsx", "04_Software/web/src/JobWorkspace.tsx", "04_Software/web/src/AuditHistory.tsx", "04_Software/web/src/errors.ts"]

