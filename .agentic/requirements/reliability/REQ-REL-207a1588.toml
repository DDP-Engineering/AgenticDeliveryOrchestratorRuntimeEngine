schema = 1

id = "REQ-REL-207a1588"

title = "Ignore superseded read completions"

status = "draft"

requirement = """
If a web read completes after its principal, authorized scope, resource identity, query, paging snapshot, generation or intervening mutation has superseded it, the interface shall ignore that completion for displayed data, feedback and freshness timestamps.
"""

verification = "Offline helper/browser: release older successes and errors after a newer scope read, mutation, timeout/retry, account change and unmount; assert neither old values nor old failure notices or timestamps overwrite the new result; a live same-generation result still publishes."

