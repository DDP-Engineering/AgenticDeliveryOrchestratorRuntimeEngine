requirement = "If a configured direct verification invocation reaches its validate time limit, the conductor shall account for exactly one failed attempt under recovery.max_stage_failures with evidence explicitly saying timed out and the same build-remediation or exhausted-failure routing as a nonzero result."
verification = "Offline tests return an authoritative timed_out flag with captured output at limits one and greater than one, then inspect failure history, saved timed-out evidence and routing; an ordinary exit 124 without the timeout flag is a non-timeout failure, and timed_out=true with exit zero never counts as a pass."
