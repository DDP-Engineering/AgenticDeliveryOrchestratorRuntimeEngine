title = "Coalesce overlapping same-context reads"

status = "draft"

requirement = """
While a web resource read is in flight for the same context, the interface shall serialize or coalesce automatic ticks, visible-tab revalidation, explicit Refresh/retry and operation-completion triggers into bounded work without concurrent duplicate reads for that resource/context.
"""

verification = "Offline fake-clock/browser: hold one resource, advance multiple ticks, dispatch repeated visibility events, double-click Refresh and complete an operation; observe maximum one concurrent request per context and no queued request burst on release; switch context and verify the new read is not blocked indefinitely by the old one."

