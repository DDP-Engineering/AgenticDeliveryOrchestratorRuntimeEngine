title = "Project recorded direct evidence to authorized job details"

status = "draft"

requirement = """
When an authorized web job detail read succeeds for a direct run, the job service shall project an allowlisted, validated and redacted view of its recorded executor attempt and latest independent verification evidence, using explicit absence where unrecorded and read-only local snapshots.
"""

verification = "Persist genuine direct state/journals for absent, not-configured, pass, failure and timeout evidence; read detail as Admin and assigned Developer and compare latest attempt, saved command, status, exit, seconds and output after redaction, including changed/missing current config, zero/fractional durations, empty tails and line/character bounds; unauthorized corrupt sources remain unread and cross-project detail returns 404; malformed selected evidence returns the existing typed error without writes, partial totals, secrets or external commands."

