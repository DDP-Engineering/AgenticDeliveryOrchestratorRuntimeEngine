schema = 1

id = "REQ-DATA-d535499a"

title = "Publish coherent Statistics refresh generations"

status = "active"

requirement = """
When Statistics publishes an initial or refreshed report globally or for one project, the interface shall publish metrics and usage only as a fully validated replacement from one coordinated reporting generation with matching authorized immutable project scope, period, timezone and granularity.
"""

verification = "Offline browser: exercise all four Statistics tabs in all-project, global single-project and project-hub modes with metrics-first and usage-first held completions; assert the previous report/export disclosure survives until a complete matching generation succeeds, then changes together; reject mismatched canonical intervals across both members and every project, invalid pooled metrics/usage results (including unsafe token directions and combined input/output totals from individually valid projects), project sets, malformed members (including run collections, object rows, safe review-round counts/totals and optional revision collections/rows/scoped identities/values; absent/empty revisions remain valid), invalid cost-efficiency collection/entry structures, unsafe evidence counts, invalid monetary types or nonfinite/negative money and overflowing pooled counts/weighted results (including product/sum overflow; valid zero/unknown/weighted controls), invalid optional raw unpriced-event counts (malformed/null/negative/fractional/unsafe) and pooled overflow with valid known/zero/absent controls, foreign identities and superseded generation completions; two-project browser negatives show error/Retry without report/exports, success time or pageerror, then valid recovery."

affected_paths = ["04_Software/web/src/App.tsx", "04_Software/web/src/statistics.ts", "04_Software/web/src/metrics.ts", "04_Software/web/src/polling.ts"]

linked_tests = ["04_Software/web/tests/statistics.test.mjs", "04_Software/web/e2e/statistics.spec.ts", "04_Software/web/e2e/operationRefresh.spec.ts", "04_Software/web/e2e/reportingRefresh.spec.ts"]


