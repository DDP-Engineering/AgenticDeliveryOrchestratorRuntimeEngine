title = "TLS proxy deployment acceptance"

status = "active"

requirement = """
When the web UI is exposed to an internal network, ADORE deployment shall keep its API and worker on loopback or local process boundaries, terminate login traffic at an operator-provided TLS proxy, set secure session cookies, and reject an untrusted plain-HTTP remote listener or forged forwarding context.
"""

verification = "Run an installed API behind a local TLS test proxy and verify HTTPS login, Secure/HttpOnly/SameSite cookies, correct client/scheme handling and a loopback API listener; verify a direct non-loopback bind and forged forwarding headers from an untrusted client cannot create a remotely exposed HTTP login."

