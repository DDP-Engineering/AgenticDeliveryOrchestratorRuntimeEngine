requirement = """
While eligible web polling is active, the interface shall preserve the existing nominal resource cadences of 15 seconds for selected metrics, jobs/detail, project metadata, clean Settings, Access, audit and applicable session notice, 30 seconds for usage/global metrics/storage, 5 seconds for worker status, 2 seconds for pending operations and 1 second only for finite pending ChatGPT sign-in.
"""

