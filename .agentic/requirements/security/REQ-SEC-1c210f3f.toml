schema = 1

id = "REQ-SEC-1c210f3f"

title = "Project provider API credential lifecycle"

status = "active"

requirement = """
When an administrator saves or removes a provider API key for an idle project, ADORE shall atomically update only its approved project credential variable, preserve other credentials, return secret-free presence/source information, and reject unauthorized, stale, active-work or corrupt input without changing credentials.
"""

verification = "Offline API saves/deletes approved keys for every executor and proves their use through the existing environment contract; negative CSRF/role/key/config/env/active/pending inputs preserve bytes and expose no secret."

affected_paths = ["04_Software/adore/web/app.py", "04_Software/adore/web/executor_settings.py"]

linked_tests = ["04_Software/tests/test_executor_settings.py::test_provider_credentials_are_private_scoped_and_reversible", "04_Software/tests/test_executor_settings.py::test_credential_boundary_preserves_original_bytes", "04_Software/tests/test_executor_settings.py::test_private_write_failure_preserves_credentials"]


