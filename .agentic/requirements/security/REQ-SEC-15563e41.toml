title = "Remove evidence after authentication or access loss"

status = "draft"

requirement = """
When sign-out, account or role change, session expiry, required password change or revoked project access invalidates a web view's authorization, the interface shall immediately withhold the no-longer-authorized evidence and actions upon detecting that transition, including snapshots retained during refresh.
"""

verification = "Offline browser: hold privileged reads across sign-out/sign-in as another role and across Dev grant revocation, then release old successes; assert private data, money, exports and actions are absent under the new account/scope; exercise factory-session expiry/password-change transitions and confirm only authorized replacement data can appear."

