schema = 1

id = "REQ-SEC-7ee58549"

title = "Withhold malformed refresh evidence"

status = "active"

requirement = """
If an informational web read returns malformed, corrupt, mismatched-scope or integrity-invalid evidence, the interface shall fail closed with explicit error feedback and no affected current or retained evidence, dependent totals, exports or evidence-dependent actions.
"""

verification = "Offline helper/browser: begin with valid data, then return invalid media type/JSON, wrong field types (including malformed run collections/rows, invalid or overflowing review-round counts, and optional revision collections/rows/identity/trigger/date/token/money evidence with duplicate identities, plus optional cost-efficiency collections/entries/counts/money and pooled count/weighted overflow, and malformed/null/negative/fractional/unsafe optional unpriced-event counts or pooled sum overflow, plus unsafe pooled lifecycle/stock/total/day/quality/coverage/review counters or duration sums from individually valid projects), foreign project/run, mismatched report scopes, corrupt typed server errors and invalid provenance; assert the affected presentation and dependent actions disappear rather than becoming stale; valid evidence remains accepted in the control case."

affected_paths = ["04_Software/web/src/polling.ts", "04_Software/web/src/errors.ts", "04_Software/web/src/App.tsx", "04_Software/web/src/JobWorkspace.tsx", "04_Software/web/src/AuditHistory.tsx", "04_Software/web/src/statistics.ts", "04_Software/web/src/metrics.ts"]

