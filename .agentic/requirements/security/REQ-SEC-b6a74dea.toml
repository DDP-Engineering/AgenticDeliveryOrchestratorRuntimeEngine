id = "REQ-SEC-b6a74dea"

title = "Keep retained informational evidence separate from action authority"

status = "draft"

requirement = """
While a web snapshot is retained after informational refresh failure, the interface shall treat it as non-authoritative for enabling, confirming or submitting privileged or operational mutations that depend on that evidence.
"""

verification = "Offline browser: retain a failed-refresh job detail that formerly offered Retry/Cancel/Restart and attempt keyboard/pointer activation; assert no evidence-dependent mutation is enabled or submitted until current authority is revalidated; unrelated informational consumption failure does not invent or invalidate independent server-owned authority."

