title = "Guard Pi against publication and isolate personal resources"

status = "active"

requirement = """ADORE shall start container Pi with an ADORE-owned agent directory, PI_OFFLINE, PI_TELEMETRY=0 and PI_SKIP_VERSION_CHECK, the flags --no-approve, --no-skills, --no-extensions, --no-prompt-templates, --no-themes and --no-mcp, and its guard extension loaded explicitly with -e, and the guard shall block `git push` and the gh, glab and tea commands in the bash and powershell tools and answer project trust with no."""

verification = "The launch argv and environment carry the agent directory, variables, flags and guard path; replaying the recorded guard run yields blocked tool results for git push, gh, glab and tea and a successful echo; a live container run with a hostile personal ~/.pi records the guard blocking and no personal resource loaded."

