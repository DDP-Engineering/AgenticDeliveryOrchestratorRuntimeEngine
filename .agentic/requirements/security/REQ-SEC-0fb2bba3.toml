title = "Each ChatGPT stage receives only a short-lived access token"

status = "active"

requirement = """When ADORE launches a Pi stage, or a Test AI connection, for a project whose provider is `chatgpt`, it shall first obtain from the server's ChatGPT credential directory, through Pi in a helper container that mounts only that directory read-write, an access token valid for at least the stage limit plus five minutes (refreshing it under Pi's credential lock when needed), and pass it to Pi only as `OPENAI_API_KEY` in that launch's process environment, never in argv, the run container's creation environment or a file, and redacted from the launch evidence; the refresh token never enters a run container."""

verification = "Orchestrator test with a fake token source: the spawn env holds OPENAI_API_KEY with the token, the container provision env and argv do not, and the archived evidence shows [REDACTED] for an echoed token; unit test: the helper argv has exactly one --volume, the credential directory, and min validity = stage limit + 300 s."

