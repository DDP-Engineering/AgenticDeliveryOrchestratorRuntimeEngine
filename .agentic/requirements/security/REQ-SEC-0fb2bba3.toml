title = "Each ChatGPT stage receives only a short-lived access token"

status = "active"

requirement = """When ADORE launches a ChatGPT Pi stage or explicit model check on a container or local backend, it shall obtain through the trusted helper an access token valid for the launch limit plus five minutes, inject it only into that launch environment as OPENAI_API_KEY, and redact it from retained evidence, keeping the credential store and refresh token outside the executor session."""

verification = "Offline helper, orchestrator and native model tests assert token lifetime, launch-only injection, no credential file in agent directories, redacted evidence and no Pi launch when token acquisition fails."

