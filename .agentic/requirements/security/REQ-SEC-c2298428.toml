title = "Scoped read access to redacted project configuration"

status = "active"

requirement = """
When an authenticated user requests a project's effective configuration, the API shall return its redacted settings only if the user administers the platform or is assigned to that project. Other project identities shall return 404, and developer configuration mutations shall return 403.
"""

