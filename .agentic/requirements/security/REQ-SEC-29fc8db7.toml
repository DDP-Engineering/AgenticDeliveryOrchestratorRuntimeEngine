title = "Display raw forge HTML as literal text"

status = "active"

requirement = """
When a forge description or comment contains raw HTML in either display mode, the Tickets view shall display that HTML as literal inert text through React text nodes without interpreting it as elements or using dangerouslySetInnerHTML.
"""

verification = "Automated: render descriptions and comments containing script tags, img onerror, b onclick, iframe and raw HTML blocks; assert literal tag text, no corresponding injected DOM elements, no executed sentinel and no HTML-induced requests in both modes; ordinary Markdown still renders in Rendered mode; a source guard rejects dangerouslySetInnerHTML in the rendering path."

