title = "Open allowed forge Markdown links safely"

status = "draft"

requirement = """
When rendered forge Markdown contains an explicit link with an absolute http, https or mailto destination, the Tickets view shall expose a navigable anchor protected by rel=\"noopener noreferrer\" and target=\"_blank\" without fetching its destination automatically.
"""

